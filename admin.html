<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · The Arsenal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141010;--ink2:#1D1717;--ink3:#272020;--line:#3A2F2E;
  --parchment:#EDE6DA;--muted:#8F827A;--red:#DB0007;--brass:#C8A15A;--ok:#3FA34D;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--parchment);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:40px 22px 90px}
h1{font-family:var(--display);font-weight:400;font-size:28px;text-transform:uppercase;letter-spacing:-.01em;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:15px;text-transform:uppercase;margin:34px 0 12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--brass);text-transform:uppercase}
.lede{color:var(--muted);margin:10px 0 26px;max-width:62ch}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--brass)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--ink2);padding:13px 15px}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600}
.kpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:13px;border:1px solid var(--line)}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:500;text-align:left;padding:8px 10px;background:var(--ink2);border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px solid var(--ink3)}
td.r,th.r{text-align:right}
.spark{display:flex;gap:4px;align-items:flex-end;height:110px;margin-top:6px}
.sparkcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.sparkbar{background:var(--brass);min-height:2px;border-radius:1px}
.sparklab{font-family:var(--mono);font-size:9px;color:var(--muted);text-align:center;margin-top:5px}
code{font-family:var(--mono);font-size:11px;color:var(--brass)}
img.flag{width:20px;height:15px;object-fit:cover;border-radius:2px;vertical-align:middle;
  box-shadow:0 0 0 1px rgba(237,230,218,.14)}
.natcode{font-family:var(--mono);font-size:11px;color:var(--muted)}
.note{border-left:2px solid var(--line);padding:2px 0 2px 14px;color:var(--muted);margin:20px 0;font-size:14px}
.foot{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Admin</div>
  <h1>Traffic</h1>
  <p class="lede">How the dashboard is doing: visits, where they come from, and which pages get read most.</p>

  <div id="traffic"></div>

  <div class="foot">
    This page is not linked from the dashboard. Keep the address to yourself.<br>
    <a href="index.html">Back to the dashboard</a>
  </div>
</div>

<script>
/* Only what the Traffic section below needs: nationality lookups for the
   country table (natEntry/natName/flagImg) and small formatting helpers. */
const T = v => v === null || v === undefined ? '' : (typeof v === 'string' ? v.trim() : String(v));
const NAT_RAW = 'ENG::England|SCO::Scotland|WAL::Wales|NIR::Northern Ireland|IRL:IE:Republic of Ireland|FRA:FR:France|ESP:ES:Spain|POR:PT:Portugal|NED:NL:Netherlands|GER:DE:Germany|ITA:IT:Italy|BEL:BE:Belgium|SUI:CH:Switzerland|AUT:AT:Austria|DEN:DK:Denmark|NOR:NO:Norway|SWE:SE:Sweden|FIN:FI:Finland|ISL:IS:Iceland|POL:PL:Poland|CZE:CZ:Czechia|SVK:SK:Slovakia|HUN:HU:Hungary|ROU:RO:Romania|BUL:BG:Bulgaria|GRE:GR:Greece|TUR:TR:Turkey|CRO:HR:Croatia|SRB:RS:Serbia|SLO:SI:Slovenia|BIH:BA:Bosnia and Herzegovina|MKD:MK:North Macedonia|MNE:ME:Montenegro|ALB:AL:Albania|KOS:XK:Kosovo|UKR:UA:Ukraine|RUS:RU:Russia|BLR:BY:Belarus|LTU:LT:Lithuania|LVA:LV:Latvia|EST:EE:Estonia|GEO:GE:Georgia|ARM:AM:Armenia|AZE:AZ:Azerbaijan|CYP:CY:Cyprus|LUX:LU:Luxembourg|MLT:MT:Malta|ISR:IL:Israel|BRA:BR:Brazil|ARG:AR:Argentina|URU:UY:Uruguay|CHI:CL:Chile|COL:CO:Colombia|ECU:EC:Ecuador|PER:PE:Peru|PAR:PY:Paraguay|BOL:BO:Bolivia|VEN:VE:Venezuela|USA:US:United States|CAN:CA:Canada|MEX:MX:Mexico|CRC:CR:Costa Rica|JAM:JM:Jamaica|TRI:TT:Trinidad and Tobago|HON:HN:Honduras|PAN:PA:Panama|GUA:GT:Guatemala|HAI:HT:Haiti|CUB:CU:Cuba|NGA:NG:Nigeria|GHA:GH:Ghana|CIV:CI:Ivory Coast|SEN:SN:Senegal|CMR:CM:Cameroon|EGY:EG:Egypt|MAR:MA:Morocco|ALG:DZ:Algeria|TUN:TN:Tunisia|MLI:ML:Mali|BFA:BF:Burkina Faso|GUI:GN:Guinea|COD:CD:DR Congo|CGO:CG:Congo|ANG:AO:Angola|RSA:ZA:South Africa|ZIM:ZW:Zimbabwe|ZAM:ZM:Zambia|KEN:KE:Kenya|UGA:UG:Uganda|GAB:GA:Gabon|TOG:TG:Togo|BEN:BJ:Benin|CPV:CV:Cape Verde|GAM:GM:Gambia|SLE:SL:Sierra Leone|LBR:LR:Liberia|MTN:MR:Mauritania|NIG:NE:Niger|EQG:GQ:Equatorial Guinea|MOZ:MZ:Mozambique|MAD:MG:Madagascar|JPN:JP:Japan|KOR:KR:South Korea|CHN:CN:China|AUS:AU:Australia|NZL:NZ:New Zealand|IRN:IR:Iran|IRQ:IQ:Iraq|KSA:SA:Saudi Arabia|UAE:AE:United Arab Emirates|QAT:QA:Qatar|JOR:JO:Jordan|UZB:UZ:Uzbekistan|IND:IN:India|THA:TH:Thailand|VIE:VN:Vietnam|PHI:PH:Philippines|IDN:ID:Indonesia';
const NAT = {};
const ISO_EXTRA = 'GB:United Kingdom|IE:Ireland|CN:China|HK:Hong Kong|TW:Taiwan|SG:Singapore|'
  + 'AE:United Arab Emirates|IN:India|ID:Indonesia|MY:Malaysia|PK:Pakistan|BD:Bangladesh|'
  + 'NP:Nepal|LK:Sri Lanka|VN:Vietnam|TH:Thailand|PH:Philippines|KE:Kenya|TZ:Tanzania|'
  + 'ET:Ethiopia|SD:Sudan|IQ:Iraq|IL:Israel|SA:Saudi Arabia|LB:Lebanon|CY:Cyprus|MT:Malta|'
  + 'LU:Luxembourg|MD:Moldova|BY:Belarus|KZ:Kazakhstan|AM:Armenia|AZ:Azerbaijan|GE:Georgia';
ISO_EXTRA.split('|').forEach(row => {
  const [iso, name] = row.split(':');
  if (!NAT[iso]) NAT[iso] = {iso, name};
});
NAT_RAW.split('|').forEach(row => {
  const [code, iso, name] = row.split(':');
  NAT[code] = {iso, name};
  NAT[name.toLowerCase()] = {iso, name, code};
  const up = iso.toUpperCase();
  if (iso.length === 2 && !NAT[up]) NAT[up] = {iso, name, code};
});
const natEntry = nat => {
  const v = T(nat); if (!v) return null;
  return NAT[v.toUpperCase()] || NAT[v.toLowerCase()] || null;
};
const flagOf = nat => {
  const e = natEntry(nat);
  const iso = e ? e.iso : (T(nat).length === 2 ? T(nat).toUpperCase() : '');
  if (!iso) return '';
  return String.fromCodePoint(...iso.split('').map(ch => 127397 + ch.charCodeAt(0)));
};
const natName = nat => { const e = natEntry(nat); return e ? e.name : T(nat); };
const flagImg = nat => {
  const e = natEntry(nat);
  const code = (e ? e.iso : (T(nat).length === 2 ? T(nat) : '')).toLowerCase();
  const label = natName(nat), fb = (e && e.code ? e.code : T(nat)).toUpperCase();
  if (!code) return `<span class="natcode">${esc(fb)}</span>`;
  return `<img class="flag" src="https://flagcdn.com/w40/${code}.png" width="20" height="15"
    alt="${esc(label)}" title="${esc(label)}" loading="lazy" data-code="${esc(fb)}"
    onerror="this.replaceWith(document.createTextNode(this.dataset.code))">`;
};
const natShort = nat => {
  const v = T(nat); if (!v) return '';
  return flagOf(v) || (e => e && e.code ? e.code : v.slice(0, 3).toUpperCase())(natEntry(v));
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


const COUNTER_KEY = 'arsenal_dashboard_przemke92_v1';
const FIREBASE_DB = 'https://arsenal-dashboard-2d6e7-default-rtdb.europe-west1.firebasedatabase.app';   // same value as in index.html

/* ---------- traffic ----------
   Draw the section first, then fill it in. A blocked or hanging request must
   never leave the panel blank. */
const withTimeout = (url, ms) => {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  return fetch(url, {signal: ctl.signal}).finally(() => clearTimeout(timer));
};

const PAGE_LABEL = {
  '': 'Home', 'latest-match': 'Latest Match', squad: 'Squad', season: 'By season',
  'premier-league': 'Premier League', europe: 'Europe', 'fa-cup': 'FA Cup',
  'league-cup': 'League Cup', 'community-shield': 'Community Shield',
  history: 'Season history', 'ex-players': 'Ex-players', records: 'All-time records'
};

function trafficSkeleton(){
  document.getElementById('traffic').innerHTML = `<h2>Traffic</h2>
    <div class="kpis">
      <div class="kpi"><div class="v" id="tTotal">…</div><div class="l">Dashboard visits</div></div>
      <div class="kpi"><div class="v" id="tWeek">…</div><div class="l">Last 7 days</div></div>
      <div class="kpi"><div class="v" id="tCountries">…</div><div class="l">Countries</div></div>
    </div>
    <div id="tDetail"></div>`;
}

async function loadCounter(){
  const el = document.getElementById('tTotal');
  try{
    const r = await withTimeout(`https://countapi.mileshilliard.com/api/v1/get/${COUNTER_KEY}`, 6000);
    const n = parseInt((await r.json()).value, 10);
    el.textContent = isNaN(n) ? '—' : n.toLocaleString('en-GB');
  }catch(e){ el.textContent = '—'; el.title = 'counter unreachable'; }
}

async function loadCountries(){
  const week = document.getElementById('tWeek'), cts = document.getElementById('tCountries');
  const detail = document.getElementById('tDetail');
  if (!FIREBASE_DB){
    week.textContent = '—'; cts.textContent = '—';
    detail.innerHTML = `<div class="note">Set <code>FIREBASE_DB</code> at the top of both files to log countries.</div>`;
    return;
  }
  let rows;
  try{
    const r = await withTimeout(FIREBASE_DB.replace(/\/$/, '') + '/arsenal/visits.json', 8000);
    if (!r.ok) throw new Error('database replied ' + r.status);
    const j = await r.json();
    rows = j ? Object.values(j) : [];
  }catch(e){
    week.textContent = '—'; cts.textContent = '—';
    detail.innerHTML = `<div class="note" style="border-color:var(--red)">Could not read the database: ${esc(e.message)}.
      Check that <code>/arsenal/visits</code> allows public reads.</div>`;
    return;
  }

  const day = 86400000, now = Date.now();
  week.textContent = rows.filter(v => now - v.t < 7 * day).length;
  cts.textContent = new Set(rows.map(v => v.c)).size;

  if (!rows.length){
    detail.innerHTML = `<div class="note">Nothing logged yet. Open the dashboard in a private window and refresh this page.</div>`;
    return;
  }

  const by = {};
  rows.forEach(v => by[v.c] = (by[v.c] || 0) + 1);
  const sorted = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const max = sorted[0][1];
  let html = `<h2>Where they came from</h2><table><thead><tr>
      <th style="width:34px"></th><th>Country</th><th class="r">Visits</th><th style="width:38%"></th>
    </tr></thead><tbody>${sorted.map(([code, n]) => `<tr>
      <td>${flagImg(code)}</td><td>${esc(natName(code))}</td>
      <td class="r num">${n}</td>
      <td><div style="height:7px;width:${(n / max * 100).toFixed(1)}%;background:var(--brass)"></div></td>
    </tr>`).join('')}</tbody></table>`;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = 13; i >= 0; i--){
    const start = today.getTime() - i * day;
    days.push({label: new Date(start).getDate(), n: rows.filter(v => v.t >= start && v.t < start + day).length});
  }
  const peak = Math.max(1, ...days.map(d => d.n));
  html += `<h2>Last fortnight</h2><div class="spark">${days.map(d => `
    <div class="sparkcol" title="${d.n} on the ${d.label}">
      <div class="sparkbar" style="height:${(d.n / peak * 100).toFixed(0)}%"></div>
      <div class="sparklab">${d.label}</div>
    </div>`).join('')}</div>`;

  const withPage = rows.filter(v => v.p !== undefined);
  if (withPage.length){
    const byPage = {};
    withPage.forEach(v => byPage[v.p] = (byPage[v.p] || 0) + 1);
    const sortedPages = Object.entries(byPage).sort((a, b) => b[1] - a[1]);
    const pmax = sortedPages[0][1];
    html += `<h2>Most visited pages</h2><table><thead><tr>
        <th>Page</th><th class="r">Visits</th><th style="width:38%"></th>
      </tr></thead><tbody>${sortedPages.map(([id, n]) => `<tr>
        <td>${esc(PAGE_LABEL[id] || id || 'Home')}</td>
        <td class="r num">${n}</td>
        <td><div style="height:7px;width:${(n / pmax * 100).toFixed(1)}%;background:var(--brass)"></div></td>
      </tr>`).join('')}</tbody></table>
      <div class="note">Only counts visits logged since this was added — older visits didn't record a page.</div>`;
  }
  detail.innerHTML = html;
}

trafficSkeleton();
loadCounter();
loadCountries();
</script>
</body>
</html>
