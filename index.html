/* Converts a wall-clock time in a named zone to the correct UTC instant,
   accounting for DST, without pulling in a date library. Match times are
   entered in Europe/Warsaw local time, so this makes the countdown land on
   the right second for a visitor anywhere in the world. */
function zonedTimeToUtc(y, mo, d, h, mi, tz){
  const guess = new Date(Date.UTC(y, mo - 1, d, h, mi));
  const dtf = new Intl.DateTimeFormat('en-US', {timeZone: tz, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'});
  const parts = dtf.formatToParts(guess).reduce((a, p) => { a[p.type] = p.value; return a; }, {});
  const hh = parts.hour === '24' ? 0 : +parts.hour;
  const asUtc = Date.UTC(+parts.year, +parts.month - 1, +parts.day, hh, +parts.minute, +parts.second || 0);
  return new Date(guess.getTime() + (guess.getTime() - asUtc));
}

function parseMatchDate(dateStr, timeStr){
  if (!dateStr) return null;
  let y, mo, d;
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)){ [y, mo, d] = dateStr.split('-').map(Number); }
  else if (/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(dateStr)){ const b = dateStr.split('.').map(Number); d = b[0]; mo = b[1]; y = b[2]; }
  else return null;
  let h = 0, mi = 0;
  if (timeStr && /^\d{1,2}:\d{2}$/.test(timeStr)){ const t = timeStr.split(':').map(Number); h = t[0]; mi = t[1]; }
  const dt = zonedTimeToUtc(y, mo, d, h, mi, 'Europe/Warsaw');
  return isNaN(dt) ? null : dt;
}

function matchCard(rec, kind, linked){
  if (!rec || !rec.club) return '';
  const club = rec.club, comp = rec.competition || '';
  const venue = rec['h/a'] || rec.venue || '';
  const when = [rec.date, rec.time].filter(Boolean).join(' · ');
  const cls = `mcard ${kind === 'next' ? 'mnext' : 'mlast'}${linked ? ' mcardLink' : ''}`;
  const tag = linked ? 'a' : 'div';
  const open = linked ? `<a class="${cls}" href="#/latest-match">` : `<div class="${cls}">`;
  return `${open}
    <div class="mlabel">${kind === 'next' ? 'Next game' : 'Last game'}</div>
    <div class="mtop">
      ${badgeFor(club, 'clubs')}
      <div class="mwho">
        <div class="mclub">${esc(club)}</div>
        <div class="mvenue">${esc(venue)}</div>
      </div>
      ${rec.score ? `<div class="mscore">${esc(rec.score)}</div>` : ''}
    </div>
    <div class="mfoot">
      ${comp ? badgeFor(comp, 'competitions') : ''}
      <span class="mcomp">${esc(comp)}</span>
      <span class="mwhen">${esc(when)}</span>
      ${linked ? '<span class="mratingsHint">Ratings →</span>' : ''}
    </div>
  </${tag}>`;
}

function kickoffStrip(rec){
  if (!rec || !rec.club) return '';
  const target = parseMatchDate(rec.date, rec.time);
  if (!target) return '';
  return `<div class="kickoff">
    <div class="klabel">Kick-off vs ${esc(rec.club)} in</div>
    <div class="countdown" id="countdown" data-target="${target.getTime()}">
      <div class="cseg"><span class="cval" data-u="d">–</span><span class="clab">D</span></div>
      <div class="cseg"><span class="cval" data-u="h">–</span><span class="clab">H</span></div>
      <div class="cseg"><span class="cval" data-u="m">–</span><span class="clab">M</span></div>
      <div class="cseg"><span class="cval" data-u="s">–</span><span class="clab">S</span></div>
    </div>
  </div>`;
}

function matchBar(d){
  if (!d.match) return '';
  const hasRatings = !!(d.ratings && d.ratings.length);
  const next = matchCard(d.match.next, 'next'), last = matchCard(d.match.last, 'last', hasRatings);
  if (!next && !last) return '';
  return `<div class="matchbar">${next}${last}${kickoffStrip(d.match.next)}</div>`;
}

/* ============================================================
   PITCH — post-match ratings, its own page (Latest Match). Flat pitch,
   drawn wide so a full back four/five of surnames never has to crowd —
   no CSS 3D, no perspective, just plain proportional coordinates, which
   also renders identically and reliably on every device.
   ============================================================ */
const PITCH_POS = {
  GK:  {y: 94, xMin: 50, xMax: 50},
  LB:  {y: 76, xMin: 4,  xMax: 20}, CB:  {y: 76, xMin: 26, xMax: 74}, RB:  {y: 76, xMin: 80, xMax: 96},
  CDM: {y: 62, xMin: 26, xMax: 74},
  LM:  {y: 48, xMin: 4,  xMax: 20}, CM:  {y: 48, xMin: 26, xMax: 74}, RM:  {y: 48, xMin: 80, xMax: 96},
  CAM: {y: 34, xMin: 20, xMax: 80},
  LW:  {y: 18, xMin: 4,  xMax: 20}, RW:  {y: 18, xMin: 80, xMax: 96},
  ST:  {y: 8,  xMin: 20, xMax: 80}, CF:  {y: 8,  xMin: 20, xMax: 80}
};
const PITCH_VBW = 400, PITCH_VBH = 520;
const PITCH_TOP_Y = 34, PITCH_BOTTOM_Y = 486;

function pitchXY(xPct, yPct){
  return {x: (xPct / 100) * PITCH_VBW, y: PITCH_TOP_Y + (yPct / 100) * (PITCH_BOTTOM_Y - PITCH_TOP_Y)};
}
function spreadX(n, xMin, xMax){
  if (n <= 1) return [(xMin + xMax) / 2];
  const out = [];
  for (let i = 0; i < n; i++) out.push(xMin + (i * (xMax - xMin)) / (n - 1));
  return out;
}
function ratingColor(r){ return r >= 7 ? 'var(--win)' : r >= 6 ? 'var(--draw)' : 'var(--loss)'; }
function surnameOf(n){
  const parts = String(n).split(' ');
  let i = 0;
  while (i < parts.length && parts[i] === parts[i].toUpperCase() && /[A-ZÀ-Ý]/.test(parts[i])) i++;
  return (i === 0 ? parts : parts.slice(0, i)).join(' ');
}
const pitchLabel = s => s.length > 11 ? s.slice(0, 10) + '…' : s;
/* "G", "A", or both ("G,A" / "G A" / "GA") in the Goal/Assist column —
   token-matched so a full word like "Goal" never false-triggers the A. */
function parseGA(val){
  const tokens = String(val || '').toUpperCase().split(/[^A-Z]+/).filter(Boolean);
  return {goal: tokens.includes('G'), assist: tokens.includes('A')};
}
/* Ratings only carry a short name (whatever was pasted from WhoScored),
   so it's matched back to the roster by surname, accent- and punctuation-
   insensitive. Unmatched names (a typo, a very new loanee) still render,
   just without a photo/profile link behind them. */
function resolveRatingPlayer(d, rawName){
  if (!resolveRatingPlayer._idx || resolveRatingPlayer._for !== d){
    const idx = {};
    const add = list => (list || []).forEach(p => {
      const k = normName(surnameOf(p.name));
      if (k && !idx[k]) idx[k] = p.name;
    });
    add(d.career && d.career.players);
    add(d.exPlayers && d.exPlayers.players);
    resolveRatingPlayer._idx = idx; resolveRatingPlayer._for = d;
  }
  const full = resolveRatingPlayer._idx[normName(rawName)];
  return {full: full || null, label: properName(full ? surnameOf(full) : rawName)};
}

function pitchMarkings(){
  const P = pitchXY, pt = p => `${p.x},${p.y}`;
  const corner = [P(0, 0), P(100, 0), P(100, 100), P(0, 100)].map(pt).join(' ');
  const bands = [0, 20, 40, 60, 80, 100];
  const stripes = bands.slice(0, -1).map((y0, i) => {
    const pts = [P(0, y0), P(100, y0), P(100, bands[i + 1]), P(0, bands[i + 1])].map(pt).join(' ');
    return `<polygon points="${pts}" fill="${i % 2 ? 'rgba(255,255,255,.02)' : 'none'}"/>`;
  }).join('');
  const box = (y0, y1) => {
    const pts = [P(20, y0), P(80, y0), P(80, y1), P(20, y1)].map(pt).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="rgba(237,230,218,.22)" stroke-width="1.5"/>`;
  };
  const half = `<line x1="${P(0,50).x}" y1="${P(0,50).y}" x2="${P(100,50).x}" y2="${P(100,50).y}" stroke="rgba(237,230,218,.22)" stroke-width="1.5"/>`;
  const cc = P(50, 50);
  const circle = `<circle cx="${cc.x}" cy="${cc.y}" r="46" fill="none" stroke="rgba(237,230,218,.22)" stroke-width="1.5"/>`;
  return `<rect x="0" y="${PITCH_TOP_Y}" width="${PITCH_VBW}" height="${PITCH_BOTTOM_Y - PITCH_TOP_Y}" fill="#1C2420"/>
    <polygon points="${corner}" fill="none" stroke="rgba(237,230,218,.28)" stroke-width="1.5"/>
    ${stripes}${half}${circle}${box(0, 14)}${box(86, 100)}`;
}

function markBadges(x, y, row){
  const {goal, assist} = parseGA(row.ga);
  const subbed = /subbed/i.test(row.status);
  const assistY = goal ? y + 11 : y - 13;
  return `${subbed ? `<text x="${x + 17}" y="${y - 12}" text-anchor="middle" class="subMark down">↓</text>` : ''}
    ${goal ? `<circle cx="${x - 17}" cy="${y - 13}" r="9" fill="var(--ink3)"/>
      <text x="${x - 17}" y="${y - 9}" text-anchor="middle" class="gaIcon ball">⚽</text>` : ''}
    ${assist ? `<circle cx="${x - 17}" cy="${assistY}" r="8" fill="var(--brass)"/>
      <text x="${x - 17}" y="${assistY + 4}" text-anchor="middle" class="gaIcon assist">A</text>` : ''}`;
}

function pitchCard(d){
  const starters = d.ratings.filter(r => /^90$|subbed/i.test(r.status));
  const subs = d.ratings.filter(r => /^sub$/i.test(r.status));
  if (!starters.length) return '';

  const groups = {};
  starters.forEach(r => {
    const code = String(r.pos || '').toUpperCase().trim();
    const key = code === 'CF' ? 'ST' : code;
    (groups[key] = groups[key] || []).push(r);
  });
  const placed = [];
  Object.keys(groups).forEach(key => {
    const band = PITCH_POS[key] || PITCH_POS.CM;
    const xs = spreadX(groups[key].length, band.xMin, band.xMax);
    groups[key].forEach((r, i) => placed.push({row: r, xPct: xs[i], yPct: band.y}));
  });

  const marks = placed.map(({row, xPct, yPct}) => {
    const {full, label} = resolveRatingPlayer(d, row.name);
    const {x, y} = pitchXY(xPct, yPct);
    const color = ratingColor(row.rating);
    return `<g class="pmark"${full ? ` data-player="${esc(full)}"` : ''}>
      <circle cx="${x}" cy="${y}" r="17" fill="var(--ink2)" stroke="${color}" stroke-width="2.5"/>
      <text x="${x}" y="${y + 4}" text-anchor="middle" class="prat" fill="${color}">${row.rating ? row.rating.toFixed(1) : '·'}</text>
      <text x="${x}" y="${y + 30}" text-anchor="middle" class="pnamet">${esc(pitchLabel(label))}</text>
      ${markBadges(x, y, row)}
    </g>`;
  }).join('');

  const subsHTML = subs.length ? `<div class="subsList">
    <div class="subsHead">Substitutes</div>
    ${subs.map(row => {
      const {full, label} = resolveRatingPlayer(d, row.name);
      const {goal, assist} = parseGA(row.ga);
      return `<div class="subRow${full ? ' clickable' : ''}"${full ? ` data-player="${esc(full)}"` : ''}>
        <span class="subMark up">↑</span>
        <span class="subName">${esc(label)}</span>
        ${goal ? '<span class="gaIcon ball">⚽</span>' : ''}
        ${assist ? '<span class="gaIcon assist">A</span>' : ''}
        <span class="subRating" style="color:${ratingColor(row.rating)}">${row.rating ? row.rating.toFixed(1) : '·'}</span>
      </div>`;
    }).join('')}
  </div>` : '';

  return `<div class="pitchCard">
      <svg viewBox="0 0 ${PITCH_VBW} ${PITCH_VBH}" class="pitchSvg">
        ${pitchMarkings()}
        ${marks}
      </svg>
      ${subsHTML}
    </div>`;
}

function pageRatings(d){
  const last = d.match && d.match.last;
  const sub = last && last.club ? `${esc(last.club)}${last.score ? ' · ' + esc(last.score) : ''}${last.date ? ' · ' + esc(last.date) : ''}` : '';
  if (!d.ratings || !d.ratings.length){
    return head('The Arsenal Dashboard', 'Latest Match', 'No ratings entered for the last match yet.');
  }
  return head('The Arsenal Dashboard', 'Latest Match', sub) + pitchCard(d);
}

function pageHome(d){
  const key = d.currentSeason;
  return head('The Arsenal Dashboard', 'Home',
    'Where the season stands right now, and the names at the top of the ledger.')
    + matchBar(d)
    + standingsBlock(d)
    + `<div class="section-h"><h2>Season ${esc(key)}</h2>
        <span class="hint">this campaign, all competitions</span></div>`
    + kpiSeason(d)
    + `<div class="section-h"><h2>The current squad</h2>
        <span class="hint">totals since each player joined</span></div>`
    + kpiClub(d)
    + `<div class="section-h"><h2>Club records</h2>
        <span class="hint">every Arsenal player, all time</span></div>`
    + kpiAllTime(d);
}

function pageSquad(d){
  const f = state.sel.pos || '';
  const hasProfiles = Object.keys(d.profiles || {}).length > 0;
  const set = {comps: d.career.comps, hasAst: d.career.hasAst,
    players: d.career.players.filter(p => !f || posGroup(prof(d, p).pos) === f)};
  const chips = hasProfiles ? `<div class="chips" id="posChips">${POS_FILTERS.map(([v, label]) => {
      const n = v ? d.career.players.filter(p => posGroup(prof(d, p).pos) === v).length : d.career.players.length;
      return n ? `<button class="chip ${f === v ? 'on' : ''}" data-pos="${v}">${label} <span style="opacity:.6">${n}</span></button>` : '';
    }).join('')}</div>` : '';
  return head('Squad', 'Arsenal squad statistics',
    'Every appearance and goal for the current squad, in all competitions, since they joined. Click a name for a season-by-season breakdown.')
    + `<div class="section-h" style="margin-top:8px"><h2>The squad</h2><span class="hint">Apps = appearances · Gls = goals · by shirt number</span></div>`
    + chips
    + squadTable(d, set, 'squad');
}

function pageSeason(d){
  const key = state.sel.season || d.currentSeason;
  const set = d.seasons[key];
  const used = set.players.filter(p => p.total.a > 0);
  const goals = used.reduce((s, p) => s + p.total.g, 0);
  return head('By season', 'Season ' + key, 'Appearances and goals for one season at a time.')
    + `<div class="controls">
        <select id="seasonPick">${d.seasonKeys.map(k =>
          `<option value="${k}" ${k === key ? 'selected' : ''}>Season ${k}</option>`).join('')}</select>
        <span class="hint num" style="color:var(--muted)">${used.length} players used · ${goals} goals</span>
      </div>` + squadTable(d, set, 'season-' + key);
}

function pageComp(d, id){
  const c = d.competitions.find(x => x.key === id);
  if (!c) return head('Competition', 'Nothing to show', 'No data for this competition yet.');
  const played = c.fixtures.map((f, i) => c.players.some(p => p.cells[i].a > 0));
  const anyPlayed = played.filter(Boolean).length;
  const players = c.players.slice().sort((a, b) => {
    const la = prof(d, a).loan ? 1 : 0, lb = prof(d, b).loan ? 1 : 0;
    return la - lb || b.a - a.a || b.g - a.g;
  });
  const goalsTotal = c.players.reduce((s, p) => s + p.g, 0);
  const assistsTotal = c.players.reduce((s, p) => s + (p.s || 0), 0);

  const thead = `<tr><th class="corner">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted);padding:8px 10px">
        ${anyPlayed} of ${c.fixtures.length} played</div></th>
    <th class="toth t1">Apps</th><th class="toth t2">Gls</th>
    ${c.fixtures.map((f, i) => `<th class="fix"><div class="box">
      <div class="opp" style="${played[i] ? '' : 'color:var(--muted)'}">${esc(f.opponent || '—')}</div>
      <div class="st">${esc(String(f.stage).slice(0, 3))}</div></div></th>`).join('')}</tr>`;

  const body = players.map(p => { const pr = prof(d, p); return `<tr class="${pr.loan ? 'loanRow' : ''}">
    <td class="pname">${nameHTML(p.name)}${(() => {
      const ps = posShort(pr.pos); return ps ? `<span class="tag">${esc(ps)}</span>` : ''; })()}${pr.loan ? '<span class="loanTag">Loan</span>' : ''}</td>
    <td class="tot t1">${p.a || '·'}</td>
    <td class="tot t2 ${p.g ? 'goal' : ''}">${p.g || '·'}</td>
    ${p.cells.map(x => `<td class="cell">${
      x.g > 0 ? `<span class="pip scored">${x.g}</span>` :
      x.a > 0 ? `<span class="pip app">1</span>` : ''}</td>`).join('')}</tr>`; }).join('');

  return head('Competition', c.label, '')
    + `<div class="kpis" style="margin-bottom:18px">
        <div class="kpi"><div class="v">${anyPlayed}</div><div class="l">Matches played</div></div>
        <div class="kpi"><div class="v">${goalsTotal}</div><div class="l">Goals scored</div></div>
        <div class="kpi"><div class="v">${assistsTotal}</div><div class="l">Assists</div></div>
        <div class="kpi"><div class="v">${c.players.filter(p => p.a > 0).length}</div><div class="l">Players used</div></div>
      </div>
      <div class="ledger"><table><thead>${thead}</thead><tbody>${body}</tbody></table></div>`;
}

function pageHistory(d){
  const b = d.breakdown;
  const picked = state.sel.race || [b.seasons[1], b.seasons[0]].filter(Boolean);
  const W = 900, H = 330, PL = 34, PR = 12, PT = 12, PB = 26;
  const maxMw = Math.max(...b.matchweeks), maxPts = 100;
  const x = i => PL + (i / (maxMw - 1)) * (W - PL - PR);
  const y = v => PT + (1 - v / maxPts) * (H - PT - PB);
  const palette = ['#DB0007', '#C8A15A', '#EDE6DA', '#7FA6A0', '#B06A8A', '#6E8CC4'];

  const lines = picked.map((s, k) => {
    const vals = b.grid[s] || []; let run = 0; const pts = [];
    vals.forEach((v, i) => { if (v === null) return; run += v; pts.push([x(i), y(run)]); });
    if (!pts.length) return '';
    const dpath = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    const col = palette[k % palette.length];
    const lead = k * 90;
    return `<path class="draw" pathLength="1" style="--dd:${lead}ms" d="${dpath}"
        fill="none" stroke="${col}" stroke-width="2"/>
      <circle class="popIn" style="--dd:${lead + 1000}ms" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${col}"/>
      <text class="axistext popIn" style="--dd:${lead + 1050}ms" x="${(last[0] - 4).toFixed(1)}" y="${(last[1] - 8).toFixed(1)}"
        text-anchor="end" fill="${col}">${esc(s)} · ${run}</text>`;
  }).join('');

  const gridY = [0, 25, 50, 75, 100].map(v =>
    `<line class="gridline" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/>
     <text class="axistext" x="${PL - 8}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const gridX = [1, 10, 20, 30, 38].map(mw =>
    `<text class="axistext" x="${x(mw - 1)}" y="${H - 6}" text-anchor="middle">${mw}</text>`).join('');

  // final position timeline
  const tbl = b.table;
  const PW = 900, PH = 250, pPL = 34, pPT = 26, pPB = 50;
  const px = i => pPL + (i / (tbl.length - 1)) * (PW - pPL - 18);
  const py = p => pPT + ((p - 1) / 11) * (PH - pPT - pPB);
  const posPath = tbl.map((t, i) => (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(t.pos).toFixed(1)).join(' ');
  const posDots = tbl.map((t, i) => {
    const X = px(i).toFixed(1), Y = py(t.pos), champ = t.pos === 1;
    const dd = 260 + i * 22;
    return `<circle class="popIn" style="--dd:${dd}ms" cx="${X}" cy="${Y.toFixed(1)}" r="${champ ? 4 : 2.6}"
      fill="${champ ? 'var(--brass)' : 'var(--red)'}"><title>${esc(t.season)} · ${t.pos} · ${t.pts} pts</title></circle>
      <text class="axistext popIn" style="--dd:${dd + 60}ms" x="${X}" y="${(Y - 9).toFixed(1)}" text-anchor="middle"
        fill="${champ ? 'var(--brass)' : 'var(--parchment)'}"
        style="font-size:9px;font-weight:${champ ? 600 : 400}">${t.pos}</text>`;
  }).join('');
  const posLabels = tbl.map((t, i) => {
    const X = px(i).toFixed(1), Y = PH - 44;
    const yr = t.season.slice(2, 4) + '/' + t.season.slice(-2);
    return `<text class="axistext" x="${X}" y="${Y}" text-anchor="end"
      transform="rotate(-90 ${X} ${Y})" style="font-size:9px"
      fill="${t.pos === 1 ? 'var(--brass)' : 'var(--muted)'}">${esc(yr)}</text>`;
  }).join('');

  // matchweek average strip
  const avgPairs = b.avg.map((v, i) => ({mw: b.matchweeks[i], v})).filter(x => x.v !== null && x.v > 0);
  const avgMax = Math.max(...avgPairs.map(x => x.v));
  const avgMin = Math.min(...avgPairs.map(x => x.v));
  const best = avgPairs.find(x => x.v === avgMax), worst = avgPairs.find(x => x.v === avgMin);
  const avgBars = b.avg.map((v, i) => {
    if (v === null || v === 0) return '';
    const h = (v / avgMax) * 90;
    const fill = v === avgMax ? 'var(--win)' : v === avgMin ? 'var(--loss)' : 'var(--brass)';
    const op = (v === avgMax || v === avgMin) ? '1' : '.45';
    return `<rect class="popIn" style="--dd:${120 + i * 14}ms" x="${i * 21}" y="${100 - h}" width="15" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}">
      <title>MW ${b.matchweeks[i]} · ${v.toFixed(2)} pts on average</title></rect>
      ${(v === avgMax || v === avgMin) ? `<text class="axistext" x="${i * 21 + 7.5}" y="${(100 - h - 5).toFixed(1)}"
        text-anchor="middle" fill="${fill}">${b.matchweeks[i]}</text>` : ''}`;
  }).join('');

  const mg = b.managers.map(m => {
    const tot = m.w + m.d + m.l;
    return `<tr><td class="l name">${esc(m.name)}</td>
      <td class="num">${tot}</td><td class="num">${m.w}</td><td class="num">${m.d}</td><td class="num">${m.l}</td>
      <td class="num" style="color:var(--win)">${(m.w / tot * 100).toFixed(1)}%</td>
      <td style="width:180px;padding-left:14px"><div style="display:flex;height:9px">
        <div style="width:${m.w / tot * 100}%;background:var(--win)"></div>
        <div style="width:${m.d / tot * 100}%;background:var(--draw)"></div>
        <div style="width:${m.l / tot * 100}%;background:var(--loss)"></div></div></td></tr>`;
  }).join('');

  return head('Archive', 'Season history',
    'Every matchweek since 1992, then the league campaign in three views: how the points piled up, where each season finished, and which matchweek has been kindest.')
    + `<div class="section-h"><h2>Every matchweek</h2><span class="hint">one row per season, one square per matchweek</span></div>`
    + matrixBlock(d)
    + `<div class="section-h"><h2>Points race</h2><span class="hint">cumulative, matchweek by matchweek</span></div>
    <div class="chips" id="raceChips">${b.seasons.map(s =>
      `<button class="chip ${picked.includes(s) ? 'on' : ''}" data-season="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative points by matchweek">
      ${gridY}${gridX}<line class="axis" x1="${PL}" x2="${PL}" y1="${PT}" y2="${H - PB}"/>${lines}</svg></div>

    <div class="section-h"><h2>Where it finished</h2><span class="hint">league position, ${esc(tbl[0].season)} → ${esc(tbl[tbl.length - 1].season)}</span></div>
    <div class="chartbox"><svg viewBox="0 0 ${PW} ${PH}" role="img" aria-label="Final league position by season">
      ${[1, 4, 8, 12].map(p => `<line class="gridline" x1="${pPL}" x2="${PW - 18}" y1="${py(p)}" y2="${py(p)}"/>
        <text class="axistext" x="${pPL - 8}" y="${py(p) + 3}" text-anchor="end">${p}</text>`).join('')}
      <path class="draw" pathLength="1" style="--dd:60ms" d="${posPath}" fill="none"
        stroke="var(--red)" stroke-width="1.5" opacity=".55"/>${posDots}${posLabels}</svg>
      <div class="legend"><span>The number above each point is the final league position. Amber marks a title.</span></div></div>

    <div class="section-h"><h2>Kindest matchweek</h2><span class="hint">average points in each matchweek, ${b.seasons.length} seasons</span></div>
    <div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><div class="v" style="color:var(--win)">${best.v.toFixed(2)}</div>
        <div class="l">Best matchweek</div><div class="s">Matchweek ${best.mw}</div></div>
      <div class="kpi"><div class="v" style="color:var(--loss)">${worst.v.toFixed(2)}</div>
        <div class="l">Worst matchweek</div><div class="s">Matchweek ${worst.mw}</div></div>
      <div class="kpi"><div class="v">${(avgPairs.reduce((t, x) => t + x.v, 0) / avgPairs.length).toFixed(2)}</div>
        <div class="l">Average matchweek</div><div class="s">across all ${avgPairs.length}</div></div>
      <div class="kpi"><div class="v">${(avgMax - avgMin).toFixed(2)}</div>
        <div class="l">Spread</div><div class="s">best minus worst</div></div>
    </div>
    <div class="chartbox"><svg viewBox="0 0 ${b.avg.length * 21} 110" role="img" aria-label="Average points per matchweek">
      ${avgBars}</svg>
      <div class="legend"><span>Matchweek 1 on the left, ${maxMw} on the right. Green is the matchweek Arsenal has taken most points from, red the one that has cost most.</span></div></div>

    <div class="section-h"><h2>Managers</h2><span class="hint">league record</span></div>
    <div class="tablewrap"><table><thead><tr>
      <th class="l">Manager</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Win %</th><th></th>
    </tr></thead><tbody>${mg}</tbody></table></div>

    <div class="section-h"><h2>Season by season</h2></div>
    <div class="tablewrap"><table><thead><tr>
      <th class="l">Season</th><th class="l">Era</th><th>Pos</th><th>Pts</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th>
    </tr></thead><tbody>${tbl.slice().reverse().map(t => `<tr>
      <td class="l name">${esc(t.season)}</td>
      <td class="l" style="color:var(--muted);font-size:12px">${esc(t.era)}</td>
      <td class="num" style="${t.pos === 1 ? 'color:var(--brass);font-weight:600' : ''}">${t.pos}</td>
      <td class="num"><b>${t.pts}</b></td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td>
      <td class="num">${t.gf}</td><td class="num">${t.ga}</td>
      <td class="num" style="color:${t.gd >= 0 ? 'var(--brass)' : 'var(--muted)'}">${t.gd > 0 ? '+' : ''}${t.gd}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function pageExPlayers(d){
  const q = (state.sel.exq || '').toLowerCase();
  const ast = !!d.exPlayers.hasAst;
  const list = d.exPlayers.players.filter(p => !q || p.name.toLowerCase().includes(q));
  const s = state.sort.ex || {col: 'apps', dir: -1};
  const getters = {
    no: p => (p.no === '' || isNaN(parseInt(p.no))) ? 9999 : parseInt(p.no), name: p => p.name,
    pos: p => (['GK', 'DF', 'MF', 'FW'].indexOf(posGroup(prof(d, p).pos)) + 1) || 9,
    nat: p => prof(d, p).nat || 'zzz',
    apps: p => p.total.a, goals: p => p.total.g, assists: p => p.total.s || 0
  };
  const rows = sortTable(list, s.col, s.dir, getters);
  const th = (col, label, cls) =>
    `<th class="${cls || ''} sortable ${s.col === col ? 'sorted' : ''}" data-sort="${col}" data-key="ex">${label}${s.col === col ? (s.dir < 0 ? ' ↓' : ' ↑') : ''}</th>`;
  return head('Archive', 'Ex-players',
    d.exPlayers.players.length + ' players who have left, with their totals across every competition.')
    + `<div class="controls"><input type="search" id="exq" placeholder="Search a name" value="${esc(state.sel.exq || '')}">
       <span class="hint num" style="color:var(--muted)">${rows.length} shown</span></div>
    <div class="tablewrap"><table class="fixed sq exlist">
      <colgroup><col class="c-no"><col class="c-pos"><col class="c-nat"><col class="c-name">
        <col class="c-tot"><col class="c-tot">${ast ? '<col class="c-tot">' : ''}
      </colgroup>
      <thead><tr>
        ${th('no', '#')}${th('pos', 'Pos', 'c')}${th('nat', 'Nat', 'c')}${th('name', 'Player', 'l')}
        ${th('apps', 'App')}${th('goals', 'Gls')}${ast ? th('assists', 'Ast') : ''}
      </tr></thead>
      <tbody>${rows.map(p => {
        const pr = prof(d, p);
        return `<tr class="clickable" data-player="${esc(p.name)}">
        <td class="num shirt">${esc(p.no)}</td>
        <td class="c pos" title="${esc(pr.pos)}">${esc(posShort(pr.pos)) || '·'}</td>
        <td class="c nat">${pr.nat ? flagImg(pr.nat) : '·'}</td>
        <td class="l name">${nameHTML(p.name)}</td>
        <td class="num"><b>${p.total.a}</b></td>
        <td class="num goal"><b>${p.total.g || '·'}</b></td>
        ${ast ? `<td class="num assist"><b>${p.total.s || '·'}</b></td>` : ''}
      </tr>`;}).join('')}</tbody></table></div>`;
}

function pageRecords(d){
  const r = d.records;
  const list = (rows, val, other, otherLabel, label) => `<div class="tablewrap narrow"><table class="fixed rec">
    <colgroup><col class="c-no"><col class="c-name"><col class="c-tot"><col class="c-tot"><col class="c-ratio"></colgroup>
    <thead><tr><th>#</th><th class="l">Player</th><th>${label}</th><th>${otherLabel}</th><th>G/A</th></tr></thead>
    <tbody>${rows.map(x => `<tr>
      <td class="num shirt">${x.rank}</td><td class="l name">${nameHTML(x.name)}</td>
      <td class="num"><b>${x[val]}</b></td>
      <td class="num" style="color:var(--muted)">${x[other]}</td>
      <td class="num" style="color:var(--muted)">${ratio(x.goals, x.apps)}</td>
    </tr>`).join('')}</tbody></table></div>`;
  return head('Archive', 'All-time records', 'The thirty highest tallies in the club\'s history.')
    + `<div class="cols2">
        <div><div class="section-h" style="margin-top:8px"><h2>Most appearances</h2></div>
          ${list(r.apps, 'apps', 'goals', 'Goals', 'Apps')}</div>
        <div><div class="section-h" style="margin-top:8px"><h2>Most goals</h2></div>
          ${list(r.goals, 'goals', 'apps', 'Apps', 'Goals')}</div>
      </div>`;
}
/* "SAKA Bukayo" -> "Bukayo Saka" for the panel heading. Reuses the same
   rule the table split already relies on: leading all-caps tokens are the
   surname, whatever follows is the given name. A name with no such split
   (a mononym like "GABRIEL", or anything unexpected) is just proper-cased. */
function titleCaseToken(w){
  return w.split('-').map(seg => seg.split("'")
    .map(part => part ? part[0] + part.slice(1).toLowerCase() : part).join("'")).join('-');
}
function properName(s){ return s.split(' ').map(titleCaseToken).join(' '); }
function displayName(n){
  const parts = String(n).split(' ');
  let i = 0;
  while (i < parts.length && parts[i] === parts[i].toUpperCase() && /[A-ZÀ-Ý]/.test(parts[i])) i++;
  if (i === 0 || i === parts.length) return properName(n);
  return `${parts.slice(i).join(' ')} ${properName(parts.slice(0, i).join(' '))}`;
}

function playerPanel(d, name){
  const career = d.career.players.find(p => p.name === name)
    || d.exPlayers.players.find(p => p.name === name);
  if (!career) return '';
  const panelAst = !!(d.career.hasAst && d.career.players.some(x => x.name === name))
    || !!(d.exPlayers.hasAst && d.exPlayers.players.some(x => x.name === name));
  const history = d.seasonKeys.map(k => {
    const p = d.seasons[k].players.find(x => x.name === name);
    return p ? {season: k, a: p.total.a, g: p.total.g, s: d.seasons[k].hasAst ? p.total.s : null} : null;
  }).filter(x => x && (x.a || x.g));
  const maxA = Math.max(1, ...history.map(h => h.a));
  const thisSeason = d.competitions.map(c => {
    const p = c.players.find(x => x.name === name);
    if (!p || !p.a) return null;
    return {label: c.label, a: p.a, g: p.g, s: p.s || 0};
  }).filter(Boolean);

  return `<div class="scrim" id="scrim"><div class="panel fade">
    <button class="close" id="closePanel" aria-label="Close">×</button>
    <div class="phead">
      <div class="pinfo">
        <div class="eyebrow">${esc(career.no ? 'No. ' + career.no : 'Player')}</div>
        <h2>${esc(displayName(career.name))}</h2>
        ${(() => { const pr = prof(d, career);
          return (pr.pos || pr.nat) ? `<div class="pmeta">
            ${pr.pos ? `<span style="color:var(--brass)">${esc(pr.pos)}</span>` : ''}
            ${pr.pos && pr.nat ? '<span style="color:var(--muted)"> · </span>' : ''}
            ${pr.nat ? `<span>${flagImg(pr.nat)} ${esc(natName(pr.nat))}</span>` : ''}</div>` : ''; })()}
        <div class="num pstats">
          ${career.total.a} apps · ${career.total.g} goals · ${ratio(career.total.g, career.total.a)} per game</div>
      </div>
      ${(() => {
        const inSquad = d.career.players.some(x => x.name === career.name);
        if (!inSquad) return '';
        const url = state.photos[normName(career.name)];
        const parts = career.name.split(' ');
        const initials = (parts[0][0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : '');
        return `<div class="mug${url ? ' withphoto' : ''}">
          ${url ? `<img src="${esc(url)}" alt="${esc(displayName(career.name))}" loading="lazy"
               onerror="this.closest('.mug').classList.add('nophoto')">` : ''}
          <span class="mono">${esc(initials.toUpperCase())}</span>
          ${career.no ? `<span class="shirtno">${esc(career.no)}</span>` : ''}
        </div>`;
      })()}
    </div>
    <div class="tablewrap"><table class="fixed" style="min-width:0">
      <colgroup><col><col style="width:60px"><col style="width:60px">${panelAst ? '<col style="width:60px">' : ''}</colgroup>
      <thead><tr><th class="l">Competition</th><th>App</th><th>Gls</th>${panelAst ? '<th>Ast</th>' : ''}</tr></thead>
      <tbody>${d.career.comps.map(c => `<tr><td class="l">${esc(c)}</td>
        ${cellNum(career.comps[c].a)}${cellNum(career.comps[c].g, 'goal')}${panelAst ? cellNum(career.comps[c].s, 'assist') : ''}</tr>`).join('')}
      </tbody></table></div>
    ${history.length ? `<div class="section-h"><h2 style="font-size:15px">Season by season</h2></div>
      ${history.map(h => `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span class="num" style="width:52px;color:var(--muted);font-size:12px">${esc(h.season)}</span>
        <div style="flex:1;height:12px;background:var(--ink2)">
          <div style="height:100%;width:${(h.a / maxA * 100).toFixed(1)}%;background:var(--ink3)"></div></div>
        <span class="num" style="width:${h.s === null ? 74 : 104}px;font-size:12px">${h.a}a · <span class="goal">${h.g}g</span>${
          h.s === null ? '' : ` · <span class="assist">${h.s}s</span>`}</span>
      </div>`).join('')}` : ''}
    ${thisSeason.length ? `<div class="section-h"><h2 style="font-size:15px">This season</h2></div>
      <div class="tablewrap"><table class="fixed" style="min-width:0">
        <colgroup><col><col style="width:64px"><col style="width:64px"></colgroup>
        <tbody>${thisSeason.map(t => `<tr>
        <td class="l">${esc(t.label)}</td><td class="num">${t.a}</td><td class="num goal">${t.g || '·'}</td>${
          panelAst ? `<td class="num assist">${t.s || '·'}</td>` : ''}
      </tr>`).join('')}</tbody></table></div>` : ''}
  </div></div>`;
}

/* ============================================================
   6. RENDER
   ============================================================ */
function renderNav(){
  const r = route();
  let html = '', group = '';
  PAGES.forEach(p => {
    if (p.group !== group && window.innerWidth > 900){
      if (group) html += `<div class="navgroup">${p.group}</div>`;
      group = p.group;
    }
    html += `<a class="navlink ${r === p.id ? 'on' : ''}" href="#/${p.id}">${p.label}</a>`;
  });
  document.getElementById('nav').innerHTML = html;

  const s = state.source;
  const cls = s === 'repo' ? 'live' : s === 'local' ? '' : 'warn';
  const label = s === 'repo' ? 'Up to date'
    : s === 'local' ? 'Preview'
    : s === 'snapshot' ? 'Snapshot' : 'No data';
  document.getElementById('status').innerHTML =
    `<span class="dot ${cls}"></span><span>${label}</span>` +
    (state.data && state.data.meta.asOf ? `<span>· ${esc(state.data.meta.asOf)}</span>` : '') +
    (s === 'local' ? `<button class="chip" id="exitPreview" style="padding:2px 7px">exit preview</button>` : '');
  const ep = document.getElementById('exitPreview');
  if (ep) ep.onclick = clearPreview;
}

function render(){
  renderNav();
  const view = document.getElementById('view');
  const d = state.data;
  if (!d){
    view.innerHTML = head('Dashboard', 'No data loaded',
      'The statistics could not be loaded. Try again in a moment.')
      + `<div class="drop" id="drop">Have the workbook to hand? Drop it here,
         or <label style="color:var(--brass);cursor:pointer;text-decoration:underline">choose a file<input type="file" id="pick" accept=".xlsx,.xlsm" hidden></label></div>`;
    wire(); return;
  }
  const r = route();
  let html;
  if (r === '') html = pageHome(d);
  else if (r === 'squad') html = pageSquad(d);
  else if (r === 'season') html = pageSeason(d);
  else if (r === 'history') html = pageHistory(d);
  else if (r === 'ex-players') html = pageExPlayers(d);
  else if (r === 'records') html = pageRecords(d);
  else if (r === 'latest-match') html = pageRatings(d);
  else if (d.competitions.some(c => c.key === r)) html = pageComp(d, r);
  else html = head('Lost', 'Nothing here', 'Pick a page from the list.');
  const routeChanged = state.lastRoute !== r;
  state.lastRoute = r;
  view.classList.remove('enter');
  view.innerHTML = html + (state.player ? playerPanel(d, state.player) : '');
  if (routeChanged && !state.player){
    void view.offsetWidth;
    view.classList.add('enter');
    state.animateNow = true;
  }
  wire();
}

/* Counts each tile up to its value. Deliberately independent of the entrance
   CSS: it is driven by a flag set in render(), so a styling change cannot
   silently switch it off. Starts once the tile has faded in. */
function animateCounters(){
  const els = document.querySelectorAll('.kpi .v');
  let n = 0;
  els.forEach(el => {
    const m = el.textContent.trim().match(/^(\d+(?:\.\d+)?)$/);
    if (!m) return;
    const target = parseFloat(m[1]);
    if (!target) return;
    const dec = (m[1].split('.')[1] || '').length;
    const dur = 1000, begin = performance.now() + 320 + (n++) * 70;
    el.textContent = target.toFixed(dec).replace(/\d/g, '0');
    const step = now => {
      const t = Math.min(1, Math.max(0, (now - begin) / dur));
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = (target * eased).toFixed(dec);
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* Ticks the countdown once a second. Cleared and restarted on every render
   so navigating away (or the data reloading) never leaves a stray timer
   running against a detached element. */
function startCountdown(){
  if (state.countdownTimer){ clearInterval(state.countdownTimer); state.countdownTimer = null; }
  const el = document.getElementById('countdown');
  if (!el) return;
  const target = +el.dataset.target;
  if (!target) return;
  const set = (u, v) => { const n = el.querySelector(`[data-u="${u}"]`); if (n) n.textContent = v; };
  const tick = () => {
    const diff = target - Date.now();
    if (diff <= 0){
      set('d', '00'); set('h', '00'); set('m', '00'); set('s', '00');
      clearInterval(state.countdownTimer); state.countdownTimer = null;
      return;
    }
    const total = Math.floor(diff / 1000);
    set('d', String(Math.floor(total / 86400)));
    set('h', String(Math.floor((total % 86400) / 3600)).padStart(2, '0'));
    set('m', String(Math.floor((total % 3600) / 60)).padStart(2, '0'));
    set('s', String(total % 60).padStart(2, '0'));
  };
  tick();
  state.countdownTimer = setInterval(tick, 1000);
}

function wire(){
  document.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
    const key = th.dataset.key, col = th.dataset.sort;
    const cur = state.sort[key] || DEFAULT_SORT[key] || {col: 'no', dir: 1};
    state.sort[key] = {col, dir: cur.col === col ? -cur.dir : (col === 'name' || col === 'no' ? 1 : -1)};
    render();
  });
  document.querySelectorAll('tr[data-player]').forEach(tr => tr.onclick = () => {
    state.player = tr.dataset.player; render();
  });
  document.querySelectorAll('.pmark[data-player], .subRow[data-player]').forEach(el => el.onclick = () => {
    state.player = el.dataset.player; render();
  });
  const scrim = document.getElementById('scrim');
  if (scrim) scrim.onclick = e => { if (e.target === scrim) { state.player = null; render(); } };
  const close = document.getElementById('closePanel');
  if (close) close.onclick = () => { state.player = null; render(); };

  const sp = document.getElementById('seasonPick');
  if (sp) sp.onchange = () => { state.sel.season = sp.value; render(); };

  const exq = document.getElementById('exq');
  if (exq) exq.oninput = () => {
    state.sel.exq = exq.value; const pos = exq.selectionStart; render();
    const el = document.getElementById('exq'); el.focus(); el.setSelectionRange(pos, pos);
  };

  const pc = document.getElementById('posChips');
  if (pc) pc.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    state.sel.pos = b.dataset.pos === state.sel.pos ? '' : b.dataset.pos; render();
  });

  const chips = document.getElementById('raceChips');
  if (chips) chips.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const s = b.dataset.season;
    const cur = state.sel.race || [state.data.breakdown.seasons[1], state.data.breakdown.seasons[0]].filter(Boolean);
    state.sel.race = cur.includes(s) ? cur.filter(x => x !== s) : cur.concat([s]).slice(-6);
    render();
  });

  if (state.animateNow){ state.animateNow = false; animateCounters(); }
  startCountdown();

  const brand = document.querySelector('.brand');
  if (brand) brand.onclick = e => {
    e.preventDefault();
    location.hash = '#/';
    location.reload();
  };

  const matrix = document.querySelector('.matrix[data-anim="1"]');
  if (matrix){
    const play = () => {
      if (state.matrixSeen) return;
      state.matrixSeen = true;
      matrix.classList.add('anim');
    };
    if ('IntersectionObserver' in window){
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting){ play(); io.disconnect(); } });
      }, {threshold: 0.05});
      io.observe(matrix);
    } else play();
  }

  const drop = document.getElementById('drop'), pick = document.getElementById('pick');
  if (pick) pick.onchange = () => pick.files[0] && readFile(pick.files[0]);
  if (drop){
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.remove('over');
    }));
    drop.addEventListener('drop', e => {
      const f = e.dataTransfer.files[0]; if (f) readFile(f);
    });
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.player){ state.player = null; render(); }
});
window.addEventListener('resize', () => renderNav());
boot();
countVisit();
</script>
