<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arsenal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#141010;
  --ink2:#1D1717;
  --ink3:#272020;
  --line:#3A2F2E;
  --parchment:#EDE6DA;
  --muted:#8F827A;
  --red:#DB0007;
  --red-dim:#7A1114;
  --win:#3FA34D;
  --draw:#E0B341;
  --loss:#C0342B;
  --brass:#C8A15A;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.005em;text-transform:uppercase;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:212px;flex:0 0 212px;border-right:1px solid var(--line);
  padding:22px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ink);
}
.brand{padding:0 18px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .mark{
  font-family:var(--display);font-size:20px;line-height:1.12;font-weight:400;
  text-transform:uppercase;letter-spacing:-.01em;
}
.brand .mark em{font-style:normal;color:var(--red)}
.brand .sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:7px;text-transform:uppercase}
.navgroup{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);padding:16px 18px 6px;text-transform:uppercase}
.navlink{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:7px 18px;text-decoration:none;color:var(--parchment);
  border-left:2px solid transparent;font-size:14px;
}
.navlink:hover{background:var(--ink2)}
.navlink.on{border-left-color:var(--red);background:var(--ink2)}
.navlink .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;padding:34px 40px 90px;max-width:1280px}

/* ---------- page furniture ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--brass);text-transform:uppercase}
.page-title{font-size:34px;line-height:1.02;margin:8px 0 10px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 26px}
.rule{height:1px;background:var(--line);margin:26px 0}
.section-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.section-h h2{font-size:17px}
.section-h .hint{font-family:var(--mono);font-size:11px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--ink2);padding:14px 16px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.kpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;margin-top:5px}
.kpi .s{font-size:13px;color:var(--parchment);margin-top:3px}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line)}
.fixed{table-layout:fixed;min-width:954px;--w-no:42px;--w-pos:46px;--w-nat:44px}
.fixed col.c-no{width:var(--w-no)}
.fixed col.c-name{width:200px}
.fixed col.c-pos{width:var(--w-pos)}
.fixed col.c-nat{width:var(--w-nat)}
.fixed col.c-stat{width:46px}
.fixed col.c-tot{width:54px}
.fixed col.c-ratio{width:54px}
.narrow .fixed{min-width:420px;--w-no:36px}
.narrow .fixed col.c-no{width:var(--w-no)}
.narrow .fixed col.c-name{width:150px}
.narrow .fixed col.c-tot{width:58px}
.narrow .fixed col.c-ratio{width:52px}

/* the identity columns stay put while the stats scroll sideways */
.fixed th:nth-child(1),.fixed td:nth-child(1){position:sticky;left:0;z-index:2}
.fixed td:nth-child(1){background:var(--ink)}
.fixed th:nth-child(1){background:var(--ink2);z-index:3}
.fixed tbody tr:hover td:nth-child(1){background:var(--ink2)}

/* records: # then player */
.fixed.rec th:nth-child(2),.fixed.rec td:nth-child(2){position:sticky;left:var(--w-no);z-index:2;
  box-shadow:1px 0 0 var(--line)}
.fixed.rec td:nth-child(2){background:var(--ink)}
.fixed.rec th:nth-child(2){background:var(--ink2);z-index:3}
.fixed.rec tbody tr:hover td:nth-child(2){background:var(--ink2)}

/* squad: # then position, nationality and player */
.fixed.sq th:nth-child(2),.fixed.sq td:nth-child(2){position:sticky;left:var(--w-no);z-index:2}
.fixed.sq th:nth-child(3),.fixed.sq td:nth-child(3){position:sticky;left:calc(var(--w-no) + var(--w-pos));z-index:2}
.fixed.sq th:nth-child(4),.fixed.sq td:nth-child(4){position:sticky;
  left:calc(var(--w-no) + var(--w-pos) + var(--w-nat));z-index:2;box-shadow:1px 0 0 var(--line)}
.fixed.sq td:nth-child(2),.fixed.sq td:nth-child(3),.fixed.sq td:nth-child(4){background:var(--ink)}
.fixed.sq th:nth-child(2),.fixed.sq th:nth-child(3),.fixed.sq th:nth-child(4){background:var(--ink2);z-index:3}
.fixed.sq tbody tr:hover td:nth-child(2),.fixed.sq tbody tr:hover td:nth-child(3),
.fixed.sq tbody tr:hover td:nth-child(4){background:var(--ink2)}
.fixed td,.fixed th{overflow:hidden}
.fixed td.l,.fixed th.l{text-overflow:ellipsis;white-space:nowrap}
.fixed td.num{padding-left:4px;padding-right:7px}
.fixed thead th.grp{
  text-align:center;white-space:normal;line-height:1.12;padding:7px 4px;
  border-left:1px solid var(--ink3);
}
.fixed thead th.grp:first-of-type{border-left:none}
.narrow .fixed{min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
thead th{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:right;padding:9px 10px;
  background:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap;
}
thead th.l,tbody td.l{text-align:left}
thead th.c{text-align:center}
tbody td.c{text-align:center}
td.pos{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.04em}
td.nat{line-height:1}
img.flag{width:20px;height:15px;object-fit:cover;border-radius:2px;vertical-align:middle;
  box-shadow:0 0 0 1px rgba(237,230,218,.14)}
.natcode{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:6px}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--parchment)}
thead th.sorted{color:var(--brass)}
tbody td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--ink3);white-space:nowrap}
tbody tr:hover td{background:var(--ink2)}
tbody tr.clickable{cursor:pointer}
td.name{font-weight:500}
td.name .sn{font-weight:600}
td.name .gn{color:var(--muted)}
.ledger td.pname .gn{color:var(--muted)}
td.zero{color:#4E4442}
.shirt{font-family:var(--mono);font-size:11px;color:var(--brass);width:34px}
.goal{color:var(--red);font-weight:600}

/* ---------- ledger grid ---------- */
.ledger{overflow:auto;border:1px solid var(--line);max-height:74vh}
.ledger table{border-collapse:separate;border-spacing:0}
.ledger th.fix{
  padding:0;background:var(--ink2);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:2;
}
.ledger th.fix .box{width:30px;padding:8px 0 7px;text-align:center}
.ledger th.fix .opp{font-family:var(--mono);font-size:9px;letter-spacing:.02em;color:var(--parchment);
  writing-mode:vertical-rl;transform:rotate(180deg);height:76px;margin:0 auto;white-space:nowrap;overflow:hidden}
.ledger th.fix .st{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:5px}
.ledger th.corner{position:sticky;left:0;top:0;z-index:3;background:var(--ink2);text-align:left;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:170px}
.ledger td.pname{position:sticky;left:0;background:var(--ink);border-right:1px solid var(--line);
  text-align:left;font-size:13px;min-width:170px;z-index:1}
.ledger tr:hover td.pname{background:var(--ink2)}
.ledger td.cell{width:30px;height:26px;text-align:center;padding:0;border-bottom:1px solid var(--ink3)}
.pip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:18px;
  border-radius:2px;font-family:var(--mono);font-size:11px;font-weight:600}
.pip.app{background:var(--ink3);color:var(--muted)}
.pip.scored{background:var(--red);color:#fff}
.ledger td.tot{border-left:1px solid var(--line);min-width:46px;font-family:var(--mono);font-size:12px;text-align:right;padding-right:10px}

/* ---------- points matrix (hero) ---------- */
.matrix{overflow-x:auto;border:1px solid var(--line);background:var(--ink2);padding:14px 16px 16px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.mrow .lab{font-family:var(--mono);font-size:10px;color:var(--muted);width:56px;flex:0 0 56px;text-align:right}
.mrow.cur .lab{color:var(--brass)}
.mcells{display:flex;gap:2px}
.mc{width:9px;height:9px;border-radius:1px;background:#2A2222}
.mc.w{background:var(--win)}
.mc.d{background:var(--draw)}
.mc.l{background:var(--loss)}
.mc.na{background:transparent}
.mrow .pts{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:8px;width:52px}
.mhead{display:flex;gap:8px;margin-bottom:6px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.mhead .lab{width:56px;flex:0 0 56px}
.legend{display:flex;gap:16px;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px;vertical-align:middle}

/* ---------- charts ---------- */
.chartbox{border:1px solid var(--line);background:var(--ink2);padding:16px}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis{stroke:var(--line);stroke-width:1}
.gridline{stroke:#241D1D;stroke-width:1}
.axistext{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{
  font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;border-radius:2px;
}
.chip:hover{color:var(--parchment)}
.chip.on{border-color:var(--red);color:var(--parchment);background:rgba(219,0,7,.13)}

/* ---------- controls ---------- */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=search]{
  background:var(--ink2);color:var(--parchment);border:1px solid var(--line);
  padding:7px 10px;font-family:var(--mono);font-size:12px;border-radius:2px;
}
input[type=search]{min-width:200px}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{
  font-family:var(--mono);font-size:12px;padding:8px 14px;border:1px solid var(--brass);
  background:transparent;color:var(--brass);cursor:pointer;border-radius:2px;
}
.btn:hover{background:var(--brass);color:var(--ink)}

/* ---------- player panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,5,5,.72);display:flex;justify-content:flex-end;z-index:50}
.panel{width:min(560px,100%);background:var(--ink);border-left:1px solid var(--line);
  height:100%;overflow-y:auto;padding:26px 28px 60px}
.panel .close{float:right;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
.panel h2{font-size:23px;line-height:1.06;margin-bottom:6px}

/* ---------- status ---------- */
.status{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;
  color:var(--muted);padding:0 18px;margin-top:18px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:0 0 7px}
.dot.live{background:#3FA34D}
.dot.warn{background:var(--red)}
.drop{border:1px dashed var(--line);padding:26px;text-align:center;color:var(--muted);border-radius:3px}
.drop.over{border-color:var(--brass);color:var(--parchment)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media (max-width:900px){.cols2{grid-template-columns:1fr}}
.narrow table{font-size:13px}
.narrow td,.narrow th{padding:6px 8px}
.mono-list{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.9}
.note{border-left:2px solid var(--brass);padding:2px 0 2px 14px;color:var(--muted);margin:16px 0}

.loading{padding:70px 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.topbar{display:none}

@media (max-width:620px){
  /* Never display:none a table cell here. It removes the cell from the row and
     shifts every later cell into the wrong column. Narrow the columns instead. */
  .fixed{min-width:812px;--w-no:26px;--w-pos:32px;--w-nat:30px}
  .fixed col.c-name{width:104px}
  .fixed col.c-tot{width:48px}
  .fixed col.c-ratio{width:48px}
  .narrow .fixed{min-width:340px;--w-no:30px}
  .narrow .fixed col.c-name{width:120px}
  .fixed td.pos{font-size:10px;padding-left:2px;padding-right:2px}
  .fixed td.nat{padding-left:2px;padding-right:2px}
  .fixed td.shirt{padding-left:4px;padding-right:4px}
  img.flag{width:18px;height:13px}
  .fixed td.l,.fixed th.l{font-size:12px}
  .fixed td.name{white-space:normal;text-overflow:clip;line-height:1.15;padding-top:5px;padding-bottom:5px}
  .fixed td.name .gn{display:block;font-size:11px}
}
@media (max-width:900px){
  .shell{display:block}
  .rail{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:16px 0 0}
  .brand{padding:0 16px 14px}
  .navgroup{display:none}
  .railnav{display:flex;overflow-x:auto;gap:0;padding:0 8px 2px}
  .navlink{border-left:none;border-bottom:2px solid transparent;white-space:nowrap;padding:9px 12px}
  .navlink.on{border-bottom-color:var(--red)}
  .navlink .n{display:none}
  .main{padding:22px 16px 70px}
  .page-title{font-size:26px}
  .mrow .lab{width:44px;flex:0 0 44px}
}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .28s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail">
    <div class="brand">
      <div class="mark">The Arsenal<br><em>Dashboard</em></div>
    </div>
    <div class="navgroup">Squad</div>
    <div class="railnav" id="nav"></div>
    <div class="status" id="status"></div>
  </nav>
  <main class="main" id="view"><div class="loading">Reading the ledger…</div></main>
</div>

<script>
/* ============================================================
   1. PARSER  —  reads arsenal_stats.xlsx by structure, not by
   fixed cell addresses, so adding a player or a cup round is safe.
   ============================================================ */
const T = v => v === null || v === undefined ? '' : (typeof v === 'string' ? v.trim() : String(v));
const N = v => {
  if (v === null || v === undefined || v === '' || v === ' ') return 0;
  const n = typeof v === 'number' ? v : parseFloat(v);
  return isNaN(n) ? 0 : n;
};
const at = (aoa, r, c) => (aoa[r] && aoa[r][c] !== undefined) ? aoa[r][c] : null;

/* Finds the header row and the identity columns wherever they sit, so inserting
   a Position or Nationality column into the sheet never breaks the parse. */
const HDR = {
  name: ['name', 'player'],
  pos:  ['pos', 'position', 'poz', 'pozycja', 'role'],
  nat:  ['nat', 'nationality', 'country', 'nationalities', 'nar', 'nation', 'kraj', 'narodowosc']
};
function findHeader(aoa){
  for (let r = 0; r < 8; r++){
    for (let c = 0; c < 8; c++){
      if (HDR.name.indexOf(T(at(aoa, r, c)).toLowerCase()) > -1){
        const cols = {no: 0, name: c};
        for (let cc = 0; cc < 12; cc++){
          const lab = T(at(aoa, r, cc)).toLowerCase();
          if (HDR.pos.indexOf(lab) > -1) cols.pos = cc;
          if (HDR.nat.indexOf(lab) > -1) cols.nat = cc;
        }
        return {row: r, cols};
      }
    }
  }
  return null;
}
function headerRow(aoa){ const h = findHeader(aoa); return h ? h.row : -1; }

/* If the header text is not one we recognise, work out which column holds the
   position and which the nationality by looking at what is actually in them. */
function sniffIdentity(aoa, h, id){
  const rows = [];
  for (let r = h + 1; r < Math.min(aoa.length, h + 60); r++) rows.push(r);
  const limit = Math.min(id.name + 5, 10);
  for (let c = 0; c <= limit; c++){
    if (c === id.name || c === id.pos || c === id.nat) continue;
    const vals = rows.map(r => T(at(aoa, r, c))).filter(Boolean);
    if (vals.length < 3) continue;
    const natHits = vals.filter(v => natEntry(v)).length;
    const posHits = vals.filter(v => posGroup(v)).length;
    if (id.nat === undefined && natHits / vals.length >= 0.6 && natHits >= posHits){ id.nat = c; continue; }
    if (id.pos === undefined && posHits / vals.length >= 0.6){ id.pos = c; }
  }
  return id;
}

function parseSquadSheet(aoa){
  const hd = findHeader(aoa); if (!hd) return null;
  const h = hd.row, id = sniffIdentity(aoa, hd.row, hd.cols);
  const above = h - 1, comps = [];
  const width = Math.max(...aoa.slice(0, h + 1).map(r => (r || []).length));
  let c = Math.max(id.name, id.pos === undefined ? 0 : id.pos, id.nat === undefined ? 0 : id.nat) + 1;
  while (c < width){
    const lab = T(at(aoa, h, c)).toLowerCase();
    if (lab.indexOf('apps') === 0 || lab === 'a'){
      let name = T(at(aoa, above, c)), cc = c;
      while (!name && cc > 0){ cc--; name = T(at(aoa, above, cc)); }
      comps.push({name: name || 'Comp', col: c});
      c += 2;
    } else c++;
  }
  const players = [];
  for (let r = h + 1; r < aoa.length; r++){
    const name = T(at(aoa, r, id.name)); if (!name) continue;
    const p = {no: T(at(aoa, r, id.no)), name, comps: {}};
    if (id.pos !== undefined) p.pos = T(at(aoa, r, id.pos));
    if (id.nat !== undefined) p.nat = T(at(aoa, r, id.nat));
    comps.forEach(k => p.comps[k.name] = {a: N(at(aoa, r, k.col)), g: N(at(aoa, r, k.col + 1))});
    p.total = p.comps['Total'] || null;
    delete p.comps['Total'];
    if (!p.total){
      p.total = {a: 0, g: 0};
      Object.values(p.comps).forEach(v => {p.total.a += v.a; p.total.g += v.g;});
    }
    players.push(p);
  }
  return {comps: comps.map(k => k.name).filter(n => n.toLowerCase() !== 'total'), players};
}

function parseMatchSheet(aoa, key, label){
  const hd = findHeader(aoa); if (!hd) return null;
  const h = hd.row, nameCol = hd.cols.name, noCol = hd.cols.no;
  const oppRow = h - 1, stageRow = h - 2;
  const width = Math.max(...aoa.slice(0, h + 1).map(r => (r || []).length));
  const fixtures = [], cols = [];
  let stage = '';
  for (let c = nameCol + 1; c < width; c++){
    if (T(at(aoa, h, c)) === 'A'){
      if (stageRow >= 0){ const s = T(at(aoa, stageRow, c)); if (s) stage = s; }
      fixtures.push({opponent: T(at(aoa, oppRow, c)), stage});
      cols.push(c); c++;
    }
  }
  const players = [];
  for (let r = h + 1; r < aoa.length; r++){
    const name = T(at(aoa, r, nameCol)); if (!name) continue;
    const cells = cols.map(c => ({a: N(at(aoa, r, c)), g: N(at(aoa, r, c + 1))}));
    players.push({
      no: T(at(aoa, r, noCol)), name, cells,
      a: cells.reduce((s, x) => s + x.a, 0),
      g: cells.reduce((s, x) => s + x.g, 0)
    });
  }
  return {key, label, fixtures, players};
}

function parseSingleMatchSheet(aoa, key, label){
  const hd = findHeader(aoa); if (!hd) return null;
  const h = hd.row, nc = hd.cols.name;
  const players = [];
  for (let r = h + 1; r < aoa.length; r++){
    const name = T(at(aoa, r, nc)); if (!name) continue;
    const a = N(at(aoa, r, nc + 1)), g = N(at(aoa, r, nc + 2));
    players.push({no: T(at(aoa, r, hd.cols.no)), name, a, g, cells: [{a, g}]});
  }
  return {key, label, fixtures: [{opponent: '', stage: label}], players};
}

function parseRecords(aoa){
  const apps = [], goals = [];
  for (let r = 2; r < aoa.length; r++){
    if (T(at(aoa, r, 1))) apps.push({rank: N(at(aoa, r, 0)), name: T(at(aoa, r, 1)),
      apps: N(at(aoa, r, 2)), goals: N(at(aoa, r, 3))});
    if (T(at(aoa, r, 8))) goals.push({rank: N(at(aoa, r, 7)), name: T(at(aoa, r, 8)),
      goals: N(at(aoa, r, 9)), apps: N(at(aoa, r, 10))});
  }
  return {apps, goals};
}

function parseBreakdown(aoa){
  const width = Math.max(...aoa.map(r => (r || []).length));
  const seasons = [], eras = {};
  for (let c = 2; c < width; c++){
    const s = T(at(aoa, 1, c)); if (s) seasons.push({label: s, col: c});
    const e = T(at(aoa, 0, c)); if (e) eras[c] = e;
  }
  const eraFor = {}; let cur = '';
  seasons.forEach(s => { if (eras[s.col]) cur = eras[s.col]; eraFor[s.label] = cur; });

  const mwRows = [];
  for (let r = 2; r < 60; r++){
    const v = at(aoa, r, 1);
    if (typeof v === 'number') mwRows.push({mw: v, row: r});
    else if (T(v).toUpperCase() === 'SUM') break;
  }
  const grid = {}, avg = [];
  seasons.forEach(s => grid[s.label] = mwRows.map(m => {
    const v = at(aoa, m.row, s.col);
    return (v === null || T(v) === '') ? null : N(v);
  }));
  mwRows.forEach(m => { const v = at(aoa, m.row, 0); avg.push(v === null ? null : N(v)); });

  const sums = {}, positions = {};
  for (let r = 2; r < 60; r++){
    const lab = T(at(aoa, r, 1)).toUpperCase();
    if (lab === 'SUM') seasons.forEach(s => sums[s.label] = N(at(aoa, r, s.col)));
    if (lab === 'POS') seasons.forEach(s => positions[s.label] = N(at(aoa, r, s.col)));
  }

  let h = -1;
  for (let r = 0; r < aoa.length; r++) if (T(at(aoa, r, 0)).toLowerCase() === 'season'){ h = r; break; }
  const table = [], managers = [];
  if (h >= 0){
    let era = '';
    for (let r = h + 1; r < aoa.length; r++){
      const s = T(at(aoa, r, 0)); if (!s) continue;
      era = T(at(aoa, r, 10)) || era;
      table.push({season: s, pos: N(at(aoa, r, 1)), pts: N(at(aoa, r, 3)),
        w: N(at(aoa, r, 4)), d: N(at(aoa, r, 5)), l: N(at(aoa, r, 6)),
        gf: N(at(aoa, r, 7)), ga: N(at(aoa, r, 8)), gd: N(at(aoa, r, 9)), era});
    }
    for (let r = h; r < aoa.length; r++){
      const nm = T(at(aoa, r, 22));
      if (nm && /[A-Za-z]/.test(nm)){
        const w = N(at(aoa, r, 24)), d = N(at(aoa, r, 25)), l = N(at(aoa, r, 26));
        if (w || d || l) managers.push({name: nm, w, d, l});
      }
    }
  }
  return {seasons: seasons.map(s => s.label), eras: eraFor,
    matchweeks: mwRows.map(m => m.mw), grid, avg, sums, positions, table, managers};
}

function parseWorkbook(wb){
  const aoa = name => wb.Sheets[name]
    ? XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: null, blankrows: true})
    : null;
  const data = {};
  data.career = parseSquadSheet(aoa('Apps & Goals'));
  const agHd = findHeader(aoa('Apps & Goals'));
  data.idCols = agHd ? sniffIdentity(aoa('Apps & Goals'), agHd.row, agHd.cols) : {};

  const seasons = {};
  wb.SheetNames.filter(n => n.indexOf('Apps & Goals ') === 0).forEach(n => {
    seasons[n.replace('Apps & Goals ', '').trim()] = parseSquadSheet(aoa(n));
  });
  data.seasons = seasons;
  data.seasonKeys = Object.keys(seasons).sort((a, b) => parseInt(b) - parseInt(a));
  data.currentSeason = data.seasonKeys[0];

  data.competitions = [
    parseMatchSheet(aoa('Premier League'), 'premier-league', 'Premier League'),
    parseMatchSheet(aoa('Europe'), 'europe', 'Europe'),
    parseMatchSheet(aoa('FA Cup'), 'fa-cup', 'FA Cup'),
    parseMatchSheet(aoa('League Cup'), 'league-cup', 'League Cup'),
    parseSingleMatchSheet(aoa('Other (CS)'), 'community-shield', 'Community Shield')
  ].filter(Boolean);

  data.exPlayers = parseSquadSheet(aoa('Ex-Players'));
  data.profiles = {};
  data.career.players.forEach(p => {
    if (p.pos || p.nat) data.profiles[p.name] = {pos: p.pos || '', nat: p.nat || ''};
  });
  data.records = parseRecords(aoa('All-time records'));
  data.breakdown = parseBreakdown(aoa('Season Breakdown'));

  /* Read the date off the local clock, not toISOString(): the workbook stores a
     naive date, and converting it to UTC shifts it a day back east of Greenwich. */
  let asOf = null;
  const ag = aoa('Apps & Goals');
  for (let r = 0; r < 4 && !asOf; r++){
    for (let c = 0; c < 40; c++){
      const v = at(ag, r, c);
      if (v instanceof Date && !isNaN(v)){
        asOf = v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0')
          + '-' + String(v.getDate()).padStart(2, '0');
        break;
      }
    }
  }
  data.meta = {asOf, source: 'arsenal_stats.xlsx'};
  return data;
}

const XLSX_PATH = 'data/arsenal_stats.xlsx';
const COUNTER_KEY = 'arsenal_dashboard_przemke92_v1';   // change the suffix to reset the count
/* Paste your Realtime Database URL here to log which country visits came from.

const FIREBASE_DB = 'https://arsenal-dashboard-2d6e7-default-rtdb.europe-west1.firebasedatabase.app';
const state = {data: null, source: 'none', err: null, sort: {}, sel: {}, player: null};
const DEFAULT_SORT = {ex: {col: 'apps', dir: -1}};   // everything else: shirt number, 1 upwards

async function countVisit(){
  let firstTime = true;
  try{
    if (sessionStorage.getItem('arsenal-counted')) firstTime = false;
    else sessionStorage.setItem('arsenal-counted', '1');
  }catch(e){}
  if (!firstTime) return;
  try{
    await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${COUNTER_KEY}`);
  }catch(e){ /* the counter is decoration: never let it break the page */ }
  if (!FIREBASE_DB) return;
  try{
    const geo = await fetch('https://api.country.is/').then(r => r.json());
    if (!geo || !geo.country) return;
    await fetch(FIREBASE_DB.replace(/\/$/, '') + '/arsenal/visits.json', {
      method: 'POST',
      body: JSON.stringify({c: geo.country, t: Date.now()})
    });
  }catch(e){ /* logging is optional too */ }
}

function readPreview(){
  try{
    const raw = sessionStorage.getItem('arsenal-preview');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearPreview(){
  try{ sessionStorage.removeItem('arsenal-preview'); }catch(e){}
  location.reload();
}

async function boot(){
  const preview = readPreview();
  if (preview){ state.data = preview; state.source = 'local'; render(); return; }
  try{
    const res = await fetch(XLSX_PATH + '?v=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    state.data = parseWorkbook(XLSX.read(buf, {type: 'array', cellDates: true}));
    state.source = 'repo';
  }catch(e){
    state.err = e.message;
    if (SNAPSHOT){ state.data = SNAPSHOT; state.source = 'snapshot'; }
  }
  render();
}

function readFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      state.data = parseWorkbook(XLSX.read(new Uint8Array(fr.result), {type: 'array', cellDates: true}));
      state.source = 'local'; state.err = null;
    }catch(e){ state.err = 'Could not read that file: ' + e.message; }
    render();
  };
  fr.readAsArrayBuffer(file);
}

const POS_WORD = {goalkeeper:'GK', keeper:'GK', defender:'DF', defence:'DF', midfielder:'MF',
  midfield:'MF', forward:'FW', attacker:'FW', striker:'ST', winger:'W', back:'B', centre:'C', center:'C'};
const posShort = p => {
  const v = T(p); if (!v) return '';
  if (v.length <= 3) return v.toUpperCase();
  const words = v.split(/[\s\-\/]+/).filter(Boolean);
  if (words.length === 1) return POS_WORD[words[0].toLowerCase()] || v.slice(0, 3).toUpperCase();
  return words.map(w => POS_WORD[w.toLowerCase()] || w[0]).join('').slice(0, 3).toUpperCase();
};
const posGroup = p => {
  const v = T(p).toLowerCase(); if (!v) return '';
  if (/goal|keeper|^gk/.test(v)) return 'GK';
  if (/def|back|^cb|^rb|^lb|^df/.test(v)) return 'DF';
  if (/mid|^cm|^dm|^am|^mf/.test(v)) return 'MF';
  if (/for|attack|strik|wing|^st|^fw|^rw|^lw|^cf/.test(v)) return 'FW';
  return '';
};
const NAT_RAW = 'ENG:gb-eng:England|SCO:gb-sct:Scotland|WAL:gb-wls:Wales|NIR:gb-nir:Northern Ireland|IRL:IE:Republic of Ireland|FRA:FR:France|ESP:ES:Spain|POR:PT:Portugal|NED:NL:Netherlands|GER:DE:Germany|ITA:IT:Italy|BEL:BE:Belgium|SUI:CH:Switzerland|AUT:AT:Austria|DEN:DK:Denmark|NOR:NO:Norway|SWE:SE:Sweden|FIN:FI:Finland|ISL:IS:Iceland|POL:PL:Poland|CZE:CZ:Czechia|SVK:SK:Slovakia|HUN:HU:Hungary|ROU:RO:Romania|BUL:BG:Bulgaria|GRE:GR:Greece|TUR:TR:Turkey|CRO:HR:Croatia|SRB:RS:Serbia|SLO:SI:Slovenia|BIH:BA:Bosnia and Herzegovina|MKD:MK:North Macedonia|MNE:ME:Montenegro|ALB:AL:Albania|KOS:XK:Kosovo|UKR:UA:Ukraine|RUS:RU:Russia|BLR:BY:Belarus|LTU:LT:Lithuania|LVA:LV:Latvia|EST:EE:Estonia|GEO:GE:Georgia|ARM:AM:Armenia|AZE:AZ:Azerbaijan|CYP:CY:Cyprus|LUX:LU:Luxembourg|MLT:MT:Malta|ISR:IL:Israel|BRA:BR:Brazil|ARG:AR:Argentina|URU:UY:Uruguay|CHI:CL:Chile|COL:CO:Colombia|ECU:EC:Ecuador|PER:PE:Peru|PAR:PY:Paraguay|BOL:BO:Bolivia|VEN:VE:Venezuela|USA:US:United States|CAN:CA:Canada|MEX:MX:Mexico|CRC:CR:Costa Rica|JAM:JM:Jamaica|TRI:TT:Trinidad and Tobago|HON:HN:Honduras|PAN:PA:Panama|GUA:GT:Guatemala|HAI:HT:Haiti|CUB:CU:Cuba|NGA:NG:Nigeria|GHA:GH:Ghana|CIV:CI:Ivory Coast|SEN:SN:Senegal|CMR:CM:Cameroon|EGY:EG:Egypt|MAR:MA:Morocco|ALG:DZ:Algeria|TUN:TN:Tunisia|MLI:ML:Mali|BFA:BF:Burkina Faso|GUI:GN:Guinea|COD:CD:DR Congo|CGO:CG:Congo|ANG:AO:Angola|RSA:ZA:South Africa|ZIM:ZW:Zimbabwe|ZAM:ZM:Zambia|KEN:KE:Kenya|UGA:UG:Uganda|GAB:GA:Gabon|TOG:TG:Togo|BEN:BJ:Benin|CPV:CV:Cape Verde|GAM:GM:Gambia|SLE:SL:Sierra Leone|LBR:LR:Liberia|MTN:MR:Mauritania|NIG:NE:Niger|EQG:GQ:Equatorial Guinea|MOZ:MZ:Mozambique|MAD:MG:Madagascar|JPN:JP:Japan|KOR:KR:South Korea|CHN:CN:China|AUS:AU:Australia|NZL:NZ:New Zealand|IRN:IR:Iran|IRQ:IQ:Iraq|KSA:SA:Saudi Arabia|UAE:AE:United Arab Emirates|QAT:QA:Qatar|JOR:JO:Jordan|UZB:UZ:Uzbekistan|IND:IN:India|THA:TH:Thailand|VIE:VN:Vietnam|PHI:PH:Philippines|IDN:ID:Indonesia';
const NAT = {};
const ISO_EXTRA = 'GB:United Kingdom|IE:Ireland|CN:China|HK:Hong Kong|TW:Taiwan|SG:Singapore|'
  + 'AE:United Arab Emirates|IN:India|ID:Indonesia|MY:Malaysia|PK:Pakistan|BD:Bangladesh|'
  + 'NP:Nepal|LK:Sri Lanka|VN:Vietnam|TH:Thailand|PH:Philippines|KE:Kenya|TZ:Tanzania|'
  + 'ET:Ethiopia|SD:Sudan|IQ:Iraq|IL:Israel|SA:Saudi Arabia|LB:Lebanon|CY:Cyprus|MT:Malta|'
  + 'LU:Luxembourg|MD:Moldova|BY:Belarus|KZ:Kazakhstan|AM:Armenia|AZ:Azerbaijan|GE:Georgia';
ISO_EXTRA.split('|').forEach(row => {
  const [iso, name] = row.split(':');
  if (!NAT[iso]) NAT[iso] = {iso, name};
});
NAT_RAW.split('|').forEach(row => {
  const [code, iso, name] = row.split(':');
  NAT[code] = {iso, name};
  NAT[name.toLowerCase()] = {iso, name, code};
  const up = iso.toUpperCase();
  if (iso.length === 2 && !NAT[up]) NAT[up] = {iso, name, code};   // so 'PL' works too
});
const natEntry = nat => {
  const v = T(nat); if (!v) return null;
  return NAT[v.toUpperCase()] || NAT[v.toLowerCase()] || null;
};
const flagOf = nat => {
  const e = natEntry(nat);
  const iso = e ? e.iso : (T(nat).length === 2 ? T(nat).toUpperCase() : '');
  if (!iso || iso.length !== 2) return '';
  return String.fromCodePoint(...iso.split('').map(ch => 127397 + ch.charCodeAt(0)));
};
const natName = nat => { const e = natEntry(nat); return e ? e.name : T(nat); };
const flagImg = nat => {
  const e = natEntry(nat);
  const code = (e ? e.iso : (T(nat).length === 2 ? T(nat) : '')).toLowerCase();
  const label = natName(nat), fb = (e && e.code ? e.code : T(nat)).toUpperCase();
  if (!code) return `<span class="natcode">${esc(fb)}</span>`;
  return `<img class="flag" src="https://flagcdn.com/w40/${code}.png" width="20" height="15"
    alt="${esc(label)}" title="${esc(label)}" loading="lazy" data-code="${esc(fb)}"
    onerror="this.replaceWith(document.createTextNode(this.dataset.code))">`;
};
const natShort = nat => {
  const v = T(nat); if (!v) return '';
  return flagOf(v) || (e => e && e.code ? e.code : v.slice(0, 3).toUpperCase())(natEntry(v));
};

const nameHTML = n => {
  const parts = String(n).split(' ');
  let i = 0;
  while (i < parts.length && parts[i] === parts[i].toUpperCase() && /[A-ZÀ-Ý]/.test(parts[i])) i++;
  if (i === 0 || i === parts.length) return `<span class="sn">${esc(n)}</span>`;
  return `<span class="sn">${esc(parts.slice(0, i).join(' '))}</span> <span class="gn">${esc(parts.slice(i).join(' '))}</span>`;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = n => { const p = String(n).split(' '); return p.length > 1 ? p[0] : n; };
const cellNum = (v, cls) => `<td class="num ${v ? (cls || '') : 'zero'}">${v || '·'}</td>`;
const ratio = (g, a) => a ? (g / a).toFixed(2) : '—';

function head(eyebrow, title, lede){
  return `<div class="fade"><div class="eyebrow">${esc(eyebrow)}</div>
    <h1 class="page-title">${esc(title)}</h1>
    ${lede ? `<p class="lede">${esc(lede)}</p>` : ''}</div>`;
}

function sortTable(rows, key, dir, getters){
  const g = getters[key]; if (!g) return rows;
  return rows.slice().sort((a, b) => {
    const x = g(a), y = g(b);
    if (typeof x === 'string') return dir * x.localeCompare(y);
    return dir * (x - y);
  });
}

/* ============================================================
   5. PAGES
   ============================================================ */
function kpiBlock(d){
  const key = d.currentSeason;
  const cur = d.seasons[key];
  const scorer = cur.players.slice().sort((a, b) => b.total.g - a.total.g)[0];
  const appsLeader = cur.players.slice().sort((a, b) => b.total.a - a.total.a)[0];
  const mostApps = d.career.players.slice().sort((a, b) => b.total.a - a.total.a)[0];
  const mostGoals = d.career.players.slice().sort((a, b) => b.total.g - a.total.g)[0];
  const tile = (v, label, name) => `<div class="kpi">
      <div class="v">${v || '—'}</div><div class="l">${esc(label)}</div>
      <div class="s">${v ? esc(name) : 'nothing recorded yet'}</div></div>`;
  return `<div class="kpis">
      ${tile(scorer.total.g, 'Top scorer ' + key, scorer.name)}
      ${tile(appsLeader.total.a, 'Most apps ' + key, appsLeader.name)}
      ${tile(mostApps.total.a, 'Most apps at the club', mostApps.name)}
      ${tile(mostGoals.total.g, 'Most goals at the club', mostGoals.name)}
    </div>`;
}

function matrixBlock(d){
  const b = d.breakdown;
  const maxMw = Math.max(...b.matchweeks);
  const rows = b.seasons.map(s => {
    const vals = b.grid[s] || [];
    const cells = b.matchweeks.map((mw, i) => {
      const v = vals[i];
      const cls = v === null ? 'na' : v === 3 ? 'w' : v === 1 ? 'd' : 'l';
      return `<div class="mc ${cls}" title="${esc(s)} · MW${mw}${v === null ? '' : ' · ' + v + ' pts'}"></div>`;
    }).join('');
    const pts = b.sums[s], pos = b.positions[s];
    return `<div class="mrow ${s === b.seasons[0] ? 'cur' : ''}">
      <div class="lab">${esc(s)}</div>
      <div class="mcells">${cells}</div>
      <div class="pts">${pts ? pts + ' · ' + (pos === 1 ? '🏆' : pos) : ''}</div>
    </div>`;
  }).join('');
  return `<div class="matrix">
      <div class="mhead"><div class="lab"></div><div>MW 1 → ${maxMw}</div></div>
      ${rows}
      <div class="legend">
        <span><i class="mc w" style="background:var(--win)"></i>Win</span>
        <span><i class="mc d" style="background:var(--draw)"></i>Draw</span>
        <span><i class="mc l" style="background:var(--loss)"></i>Loss</span>
        <span><i class="mc na" style="box-shadow:inset 0 0 0 1px var(--line)"></i>Not played</span>
        <span>🏆 League title</span>
      </div>
    </div>`;
}

function prof(d, p){
  const base = (d.profiles && d.profiles[p.name]) || {};
  return {pos: p.pos || base.pos || '', nat: p.nat || base.nat || ''};
}

function squadTable(d, set, key, dflt){
  const comps = set.comps;
  const s = state.sort[key] || DEFAULT_SORT[key] || {col: 'no', dir: 1};
  const getters = {
    no: p => (p.no === '' || isNaN(parseInt(p.no))) ? 9999 : parseInt(p.no), name: p => p.name,
    pos: p => (['GK', 'DF', 'MF', 'FW'].indexOf(posGroup(prof(d, p).pos)) + 1) || 9,
    nat: p => prof(d, p).nat || 'zzz',
    apps: p => p.total.a, goals: p => p.total.g, ratio: p => p.total.a ? p.total.g / p.total.a : -1
  };
  comps.forEach(c => {
    getters['a_' + c] = p => p.comps[c].a;
    getters['g_' + c] = p => p.comps[c].g;
  });
  const rows = sortTable(set.players, s.col, s.dir, getters);
  const th = (col, label, cls) =>
    `<th class="${cls || ''} sortable ${s.col === col ? 'sorted' : ''}" data-sort="${col}" data-key="${key}">${label}${s.col === col ? (s.dir < 0 ? ' ↓' : ' ↑') : ''}</th>`;
  const cols = `<colgroup>
      <col class="c-no"><col class="c-pos"><col class="c-nat"><col class="c-name">
      ${comps.map(() => '<col class="c-stat"><col class="c-stat">').join('')}
      <col class="c-tot"><col class="c-tot"><col class="c-ratio">
    </colgroup>`;
  return `<div class="tablewrap"><table class="fixed sq">${cols}
    <thead>
      <tr>${th('no', '#')}${th('pos', 'Pos', 'c')}${th('nat', 'Nat', 'c')}${th('name', 'Player', 'l')}
      ${comps.map(c => `<th class="grp" colspan="2">${esc(c)}</th>`).join('')}
      <th class="grp" colspan="2">Total</th>${th('ratio', 'G/A')}</tr>
      <tr><th></th><th></th><th></th><th class="l"></th>
      ${comps.map(c => th('a_' + c, 'Apps', 'c') + th('g_' + c, 'Gls', 'c')).join('')}
      ${th('apps', 'Apps')}${th('goals', 'Gls')}<th></th></tr>
    </thead>
    <tbody>${rows.map(p => {
      const pr = prof(d, p);
      return `<tr class="clickable" data-player="${esc(p.name)}">
      <td class="num shirt">${esc(p.no)}</td>
      <td class="c pos" title="${esc(pr.pos)}">${esc(posShort(pr.pos)) || '·'}</td>
      <td class="c nat">${pr.nat ? flagImg(pr.nat) : '·'}</td>
      <td class="l name">${nameHTML(p.name)}</td>
      ${comps.map(c => cellNum(p.comps[c].a) + cellNum(p.comps[c].g, 'goal')).join('')}
      <td class="num" style="border-left:1px solid var(--line)"><b>${p.total.a}</b></td>
      <td class="num goal"><b>${p.total.g || '·'}</b></td>
      <td class="num" style="color:var(--muted)">${ratio(p.total.g, p.total.a)}</td>
    </tr>`;}).join('')}</tbody></table></div>`;
}

const POS_FILTERS = [['', 'All'], ['GK', 'Goalkeepers'], ['DF', 'Defenders'], ['MF', 'Midfielders'], ['FW', 'Forwards']];

function pageSquad(d){
  const f = state.sel.pos || '';
  const hasProfiles = Object.keys(d.profiles || {}).length > 0;
  const set = {comps: d.career.comps,
    players: d.career.players.filter(p => !f || posGroup(prof(d, p).pos) === f)};
  const chips = hasProfiles ? `<div class="chips" id="posChips">${POS_FILTERS.map(([v, label]) => {
      const n = v ? d.career.players.filter(p => posGroup(prof(d, p).pos) === v).length : d.career.players.length;
      return n ? `<button class="chip ${f === v ? 'on' : ''}" data-pos="${v}">${label} <span style="opacity:.6">${n}</span></button>` : '';
    }).join('')}</div>` : '';
  return head('Squad', 'Arsenal squad statistics',
    'Every appearance and goal for the current squad, in all competitions, since they joined. Click a name for a season-by-season breakdown.')
    + kpiBlock(d)
    + `<div class="section-h"><h2>The squad</h2><span class="hint">Apps = appearances · Gls = goals · by shirt number</span></div>`
    + chips
    + squadTable(d, set, 'squad');
}

function pageSeason(d){
  const key = state.sel.season || d.currentSeason;
  const set = d.seasons[key];
  const used = set.players.filter(p => p.total.a > 0);
  const goals = used.reduce((s, p) => s + p.total.g, 0);
  return head('By season', 'Season ' + key, 'Appearances and goals for one season at a time.')
    + `<div class="controls">
        <select id="seasonPick">${d.seasonKeys.map(k =>
          `<option value="${k}" ${k === key ? 'selected' : ''}>Season ${k}</option>`).join('')}</select>
        <span class="hint num" style="color:var(--muted)">${used.length} players used · ${goals} goals</span>
      </div>` + squadTable(d, set, 'season-' + key);
}

function pageComp(d, id){
  const c = d.competitions.find(x => x.key === id);
  if (!c) return head('Competition', 'Nothing to show', 'No data for this competition yet.');
  const played = c.fixtures.map((f, i) => c.players.some(p => p.cells[i].a > 0));
  const anyPlayed = played.filter(Boolean).length;
  const players = c.players.slice().sort((a, b) => b.a - a.a || b.g - a.g);
  const goalsTotal = c.players.reduce((s, p) => s + p.g, 0);

  const thead = `<tr><th class="corner">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted);padding:8px 10px">
        ${anyPlayed} of ${c.fixtures.length} played</div></th>
    ${c.fixtures.map((f, i) => `<th class="fix"><div class="box">
      <div class="opp" style="${played[i] ? '' : 'color:var(--muted)'}">${esc(f.opponent || '—')}</div>
      <div class="st">${esc(String(f.stage).slice(0, 3))}</div></div></th>`).join('')}
    <th class="fix" style="text-align:right;padding-right:10px">Apps</th>
    <th class="fix" style="text-align:right;padding-right:10px">Gls</th></tr>`;

  const body = players.map(p => `<tr>
    <td class="pname">${nameHTML(p.name)}${(() => {
      const ps = posShort(prof(d, p).pos); return ps ? `<span class="tag">${esc(ps)}</span>` : ''; })()}</td>
    ${p.cells.map(x => `<td class="cell">${
      x.g > 0 ? `<span class="pip scored">${x.g}</span>` :
      x.a > 0 ? `<span class="pip app">1</span>` : ''}</td>`).join('')}
    <td class="tot">${p.a || '·'}</td>
    <td class="tot ${p.g ? 'goal' : ''}">${p.g || '·'}</td></tr>`).join('');

  return head('Competition', c.label, '')
    + `<div class="kpis" style="margin-bottom:18px">
        <div class="kpi"><div class="v">${anyPlayed}</div><div class="l">Matches played</div></div>
        <div class="kpi"><div class="v">${goalsTotal}</div><div class="l">Goals scored</div></div>
        <div class="kpi"><div class="v">${c.players.filter(p => p.a > 0).length}</div><div class="l">Players used</div></div>
      </div>
      <div class="ledger"><table><thead>${thead}</thead><tbody>${body}</tbody></table></div>`;
}

function pageHistory(d){
  const b = d.breakdown;
  const picked = state.sel.race || [b.seasons[1], b.seasons[0]].filter(Boolean);
  const W = 900, H = 330, PL = 34, PR = 12, PT = 12, PB = 26;
  const maxMw = Math.max(...b.matchweeks), maxPts = 100;
  const x = i => PL + (i / (maxMw - 1)) * (W - PL - PR);
  const y = v => PT + (1 - v / maxPts) * (H - PT - PB);
  const palette = ['#DB0007', '#C8A15A', '#EDE6DA', '#7FA6A0', '#B06A8A', '#6E8CC4'];

  const lines = picked.map((s, k) => {
    const vals = b.grid[s] || []; let run = 0; const pts = [];
    vals.forEach((v, i) => { if (v === null) return; run += v; pts.push([x(i), y(run)]); });
    if (!pts.length) return '';
    const dpath = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return `<path d="${dpath}" fill="none" stroke="${palette[k % palette.length]}" stroke-width="2"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${palette[k % palette.length]}"/>
      <text class="axistext" x="${(last[0] - 4).toFixed(1)}" y="${(last[1] - 8).toFixed(1)}" text-anchor="end"
        fill="${palette[k % palette.length]}">${esc(s)} · ${run}</text>`;
  }).join('');

  const gridY = [0, 25, 50, 75, 100].map(v =>
    `<line class="gridline" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/>
     <text class="axistext" x="${PL - 8}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const gridX = [1, 10, 20, 30, 38].map(mw =>
    `<text class="axistext" x="${x(mw - 1)}" y="${H - 6}" text-anchor="middle">${mw}</text>`).join('');

  // final position timeline
  const tbl = b.table;
  const PW = 900, PH = 250, pPL = 34, pPT = 26, pPB = 50;
  const px = i => pPL + (i / (tbl.length - 1)) * (PW - pPL - 18);
  const py = p => pPT + ((p - 1) / 11) * (PH - pPT - pPB);
  const posPath = tbl.map((t, i) => (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(t.pos).toFixed(1)).join(' ');
  const posDots = tbl.map((t, i) => {
    const X = px(i).toFixed(1), Y = py(t.pos), champ = t.pos === 1;
    return `<circle cx="${X}" cy="${Y.toFixed(1)}" r="${champ ? 4 : 2.6}"
      fill="${champ ? 'var(--brass)' : 'var(--red)'}"><title>${esc(t.season)} · ${t.pos} · ${t.pts} pts</title></circle>
      <text class="axistext" x="${X}" y="${(Y - 9).toFixed(1)}" text-anchor="middle"
        fill="${champ ? 'var(--brass)' : 'var(--parchment)'}"
        style="font-size:9px;font-weight:${champ ? 600 : 400}">${t.pos}</text>`;
  }).join('');
  const posLabels = tbl.map((t, i) => {
    const X = px(i).toFixed(1), Y = PH - 44;
    const yr = t.season.slice(2, 4) + '/' + t.season.slice(-2);
    return `<text class="axistext" x="${X}" y="${Y}" text-anchor="end"
      transform="rotate(-90 ${X} ${Y})" style="font-size:9px"
      fill="${t.pos === 1 ? 'var(--brass)' : 'var(--muted)'}">${esc(yr)}</text>`;
  }).join('');

  // matchweek average strip
  const avgPairs = b.avg.map((v, i) => ({mw: b.matchweeks[i], v})).filter(x => x.v !== null && x.v > 0);
  const avgMax = Math.max(...avgPairs.map(x => x.v));
  const avgMin = Math.min(...avgPairs.map(x => x.v));
  const best = avgPairs.find(x => x.v === avgMax), worst = avgPairs.find(x => x.v === avgMin);
  const avgBars = b.avg.map((v, i) => {
    if (v === null || v === 0) return '';
    const h = (v / avgMax) * 90;
    const fill = v === avgMax ? 'var(--win)' : v === avgMin ? 'var(--loss)' : 'var(--brass)';
    const op = (v === avgMax || v === avgMin) ? '1' : '.45';
    return `<rect x="${i * 21}" y="${100 - h}" width="15" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}">
      <title>MW ${b.matchweeks[i]} · ${v.toFixed(2)} pts on average</title></rect>
      ${(v === avgMax || v === avgMin) ? `<text class="axistext" x="${i * 21 + 7.5}" y="${(100 - h - 5).toFixed(1)}"
        text-anchor="middle" fill="${fill}">${b.matchweeks[i]}</text>` : ''}`;
  }).join('');

  const mg = b.managers.map(m => {
    const tot = m.w + m.d + m.l;
    return `<tr><td class="l name">${esc(m.name)}</td>
      <td class="num">${tot}</td><td class="num">${m.w}</td><td class="num">${m.d}</td><td class="num">${m.l}</td>
      <td class="num" style="color:var(--win)">${(m.w / tot * 100).toFixed(1)}%</td>
      <td style="width:180px;padding-left:14px"><div style="display:flex;height:9px">
        <div style="width:${m.w / tot * 100}%;background:var(--win)"></div>
        <div style="width:${m.d / tot * 100}%;background:var(--draw)"></div>
        <div style="width:${m.l / tot * 100}%;background:var(--loss)"></div></div></td></tr>`;
  }).join('');

  return head('Archive', 'Season history',
    'Every matchweek since 1992, then the league campaign in three views: how the points piled up, where each season finished, and which matchweek has been kindest.')
    + `<div class="section-h"><h2>Every matchweek</h2><span class="hint">one row per season, one square per matchweek</span></div>`
    + matrixBlock(d)
    + `<div class="section-h"><h2>Points race</h2><span class="hint">cumulative, matchweek by matchweek</span></div>
    <div class="chips" id="raceChips">${b.seasons.map(s =>
      `<button class="chip ${picked.includes(s) ? 'on' : ''}" data-season="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative points by matchweek">
      ${gridY}${gridX}<line class="axis" x1="${PL}" x2="${PL}" y1="${PT}" y2="${H - PB}"/>${lines}</svg></div>

    <div class="section-h"><h2>Where it finished</h2><span class="hint">league position, ${esc(tbl[0].season)} → ${esc(tbl[tbl.length - 1].season)}</span></div>
    <div class="chartbox"><svg viewBox="0 0 ${PW} ${PH}" role="img" aria-label="Final league position by season">
      ${[1, 4, 8, 12].map(p => `<line class="gridline" x1="${pPL}" x2="${PW - 18}" y1="${py(p)}" y2="${py(p)}"/>
        <text class="axistext" x="${pPL - 8}" y="${py(p) + 3}" text-anchor="end">${p}</text>`).join('')}
      <path d="${posPath}" fill="none" stroke="var(--red)" stroke-width="1.5" opacity=".55"/>${posDots}${posLabels}</svg>
      <div class="legend"><span>The number above each point is the final league position. Amber marks a title.</span></div></div>

    <div class="section-h"><h2>Kindest matchweek</h2><span class="hint">average points in each matchweek, ${b.seasons.length} seasons</span></div>
    <div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><div class="v" style="color:var(--win)">${best.v.toFixed(2)}</div>
        <div class="l">Best matchweek</div><div class="s">Matchweek ${best.mw}</div></div>
      <div class="kpi"><div class="v" style="color:var(--loss)">${worst.v.toFixed(2)}</div>
        <div class="l">Worst matchweek</div><div class="s">Matchweek ${worst.mw}</div></div>
      <div class="kpi"><div class="v">${(avgPairs.reduce((t, x) => t + x.v, 0) / avgPairs.length).toFixed(2)}</div>
        <div class="l">Average matchweek</div><div class="s">across all ${avgPairs.length}</div></div>
      <div class="kpi"><div class="v">${(avgMax - avgMin).toFixed(2)}</div>
        <div class="l">Spread</div><div class="s">best minus worst</div></div>
    </div>
    <div class="chartbox"><svg viewBox="0 0 ${b.avg.length * 21} 110" role="img" aria-label="Average points per matchweek">
      ${avgBars}</svg>
      <div class="legend"><span>Matchweek 1 on the left, ${maxMw} on the right. Green is the matchweek Arsenal has taken most points from, red the one that has cost most.</span></div></div>

    <div class="section-h"><h2>Managers</h2><span class="hint">league record</span></div>
    <div class="tablewrap"><table><thead><tr>
      <th class="l">Manager</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Win %</th><th></th>
    </tr></thead><tbody>${mg}</tbody></table></div>

    <div class="section-h"><h2>Season by season</h2></div>
    <div class="tablewrap"><table><thead><tr>
      <th class="l">Season</th><th class="l">Era</th><th>Pos</th><th>Pts</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th>
    </tr></thead><tbody>${tbl.slice().reverse().map(t => `<tr>
      <td class="l name">${esc(t.season)}</td>
      <td class="l" style="color:var(--muted);font-size:12px">${esc(t.era)}</td>
      <td class="num" style="${t.pos === 1 ? 'color:var(--brass);font-weight:600' : ''}">${t.pos}</td>
      <td class="num"><b>${t.pts}</b></td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td>
      <td class="num">${t.gf}</td><td class="num">${t.ga}</td>
      <td class="num" style="color:${t.gd >= 0 ? 'var(--brass)' : 'var(--muted)'}">${t.gd > 0 ? '+' : ''}${t.gd}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function pageExPlayers(d){
  const q = (state.sel.exq || '').toLowerCase();
  const set = {comps: d.exPlayers.comps,
    players: d.exPlayers.players.filter(p => !q || p.name.toLowerCase().includes(q))};
  return head('Archive', 'Ex-players',
    d.exPlayers.players.length + ' players who have left, with everything they did in an Arsenal shirt.')
    + `<div class="controls"><input type="search" id="exq" placeholder="Search a name" value="${esc(state.sel.exq || '')}">
       <span class="hint num" style="color:var(--muted)">${set.players.length} shown</span></div>`
    + squadTable(d, set, 'ex');
}

function pageRecords(d){
  const r = d.records;
  const list = (rows, val, other, otherLabel, label) => `<div class="tablewrap narrow"><table class="fixed rec">
    <colgroup><col class="c-no"><col class="c-name"><col class="c-tot"><col class="c-tot"><col class="c-ratio"></colgroup>
    <thead><tr><th>#</th><th class="l">Player</th><th>${label}</th><th>${otherLabel}</th><th>G/A</th></tr></thead>
    <tbody>${rows.map(x => `<tr>
      <td class="num shirt">${x.rank}</td><td class="l name">${nameHTML(x.name)}</td>
      <td class="num"><b>${x[val]}</b></td>
      <td class="num" style="color:var(--muted)">${x[other]}</td>
      <td class="num" style="color:var(--muted)">${ratio(x.goals, x.apps)}</td>
    </tr>`).join('')}</tbody></table></div>`;
  return head('Archive', 'All-time records', 'The thirty highest tallies in the club\'s history.')
    + `<div class="cols2">
        <div><div class="section-h" style="margin-top:8px"><h2>Most appearances</h2></div>
          ${list(r.apps, 'apps', 'goals', 'Goals', 'Apps')}</div>
        <div><div class="section-h" style="margin-top:8px"><h2>Most goals</h2></div>
          ${list(r.goals, 'goals', 'apps', 'Apps', 'Goals')}</div>
      </div>`;
}
function playerPanel(d, name){
  const career = d.career.players.find(p => p.name === name)
    || d.exPlayers.players.find(p => p.name === name);
  if (!career) return '';
  const history = d.seasonKeys.map(k => {
    const p = d.seasons[k].players.find(x => x.name === name);
    return p ? {season: k, a: p.total.a, g: p.total.g} : null;
  }).filter(x => x && (x.a || x.g));
  const maxA = Math.max(1, ...history.map(h => h.a));
  const thisSeason = d.competitions.map(c => {
    const p = c.players.find(x => x.name === name);
    if (!p || !p.a) return null;
    return {label: c.label, a: p.a, g: p.g};
  }).filter(Boolean);

  return `<div class="scrim" id="scrim"><div class="panel fade">
    <button class="close" id="closePanel" aria-label="Close">×</button>
    <div class="eyebrow">${esc(career.no ? 'No. ' + career.no : 'Player')}</div>
    <h2>${esc(career.name)}</h2>
    ${(() => { const pr = prof(d, career);
      return (pr.pos || pr.nat) ? `<div style="margin-bottom:10px;font-size:14px">
        ${pr.pos ? `<span style="color:var(--brass)">${esc(pr.pos)}</span>` : ''}
        ${pr.pos && pr.nat ? '<span style="color:var(--muted)"> · </span>' : ''}
        ${pr.nat ? `<span>${flagImg(pr.nat)} ${esc(natName(pr.nat))}</span>` : ''}</div>` : ''; })()}
    <div class="num" style="color:var(--muted);margin-bottom:20px">
      ${career.total.a} apps · ${career.total.g} goals · ${ratio(career.total.g, career.total.a)} per game</div>
    <div class="tablewrap"><table class="fixed" style="min-width:0">
      <colgroup><col><col style="width:64px"><col style="width:64px"></colgroup>
      <thead><tr><th class="l">Competition</th><th>Apps</th><th>Gls</th></tr></thead>
      <tbody>${d.career.comps.map(c => `<tr><td class="l">${esc(c)}</td>
        ${cellNum(career.comps[c].a)}${cellNum(career.comps[c].g, 'goal')}</tr>`).join('')}
      </tbody></table></div>
    ${history.length ? `<div class="section-h"><h2 style="font-size:15px">Season by season</h2></div>
      ${history.map(h => `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span class="num" style="width:52px;color:var(--muted);font-size:12px">${esc(h.season)}</span>
        <div style="flex:1;height:12px;background:var(--ink2)">
          <div style="height:100%;width:${(h.a / maxA * 100).toFixed(1)}%;background:var(--ink3)"></div></div>
        <span class="num" style="width:74px;font-size:12px">${h.a}a · <span class="goal">${h.g}g</span></span>
      </div>`).join('')}` : ''}
    ${thisSeason.length ? `<div class="section-h"><h2 style="font-size:15px">This season</h2></div>
      <div class="tablewrap"><table class="fixed" style="min-width:0">
        <colgroup><col><col style="width:64px"><col style="width:64px"></colgroup>
        <tbody>${thisSeason.map(t => `<tr>
        <td class="l">${esc(t.label)}</td><td class="num">${t.a}</td><td class="num goal">${t.g || '·'}</td>
      </tr>`).join('')}</tbody></table></div>` : ''}
  </div></div>`;
}

/* ============================================================
   6. RENDER
   ============================================================ */
function renderNav(){
  const r = route();
  let html = '', group = '';
  PAGES.forEach(p => {
    if (p.group !== group && window.innerWidth > 900){
      if (group) html += `<div class="navgroup">${p.group}</div>`;
      group = p.group;
    }
    html += `<a class="navlink ${r === p.id ? 'on' : ''}" href="#/${p.id}">${p.label}</a>`;
  });
  document.getElementById('nav').innerHTML = html;

  const s = state.source;
  const cls = s === 'repo' ? 'live' : s === 'local' ? '' : 'warn';
  const label = s === 'repo' ? 'Up to date'
    : s === 'local' ? 'Preview'
    : s === 'snapshot' ? 'Snapshot' : 'No data';
  document.getElementById('status').innerHTML =
    `<span class="dot ${cls}"></span><span>${label}</span>` +
    (state.data && state.data.meta.asOf ? `<span>· ${esc(state.data.meta.asOf)}</span>` : '') +
    (s === 'local' ? `<button class="chip" id="exitPreview" style="padding:2px 7px">exit preview</button>` : '');
  const ep = document.getElementById('exitPreview');
  if (ep) ep.onclick = clearPreview;
}

function render(){
  renderNav();
  const view = document.getElementById('view');
  const d = state.data;
  if (!d){
    view.innerHTML = head('Dashboard', 'No data loaded',
      'The statistics could not be loaded. Try again in a moment.')
      + `<div class="drop" id="drop">Have the workbook to hand? Drop it here,
         or <label style="color:var(--brass);cursor:pointer;text-decoration:underline">choose a file<input type="file" id="pick" accept=".xlsx,.xlsm" hidden></label></div>`;
    wire(); return;
  }
  const r = route();
  let html;
  if (r === '' || r === 'squad') html = pageSquad(d);
  else if (r === 'season') html = pageSeason(d);
  else if (r === 'history') html = pageHistory(d);
  else if (r === 'ex-players') html = pageExPlayers(d);
  else if (r === 'records') html = pageRecords(d);
  else if (d.competitions.some(c => c.key === r)) html = pageComp(d, r);
  else html = head('Lost', 'Nothing here', 'Pick a page from the list.');
  view.innerHTML = html + (state.player ? playerPanel(d, state.player) : '');
  wire();
}

function wire(){
  document.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
    const key = th.dataset.key, col = th.dataset.sort;
    const cur = state.sort[key] || DEFAULT_SORT[key] || {col: 'no', dir: 1};
    state.sort[key] = {col, dir: cur.col === col ? -cur.dir : (col === 'name' || col === 'no' ? 1 : -1)};
    render();
  });
  document.querySelectorAll('tr[data-player]').forEach(tr => tr.onclick = () => {
    state.player = tr.dataset.player; render();
  });
  const scrim = document.getElementById('scrim');
  if (scrim) scrim.onclick = e => { if (e.target === scrim) { state.player = null; render(); } };
  const close = document.getElementById('closePanel');
  if (close) close.onclick = () => { state.player = null; render(); };

  const sp = document.getElementById('seasonPick');
  if (sp) sp.onchange = () => { state.sel.season = sp.value; render(); };

  const exq = document.getElementById('exq');
  if (exq) exq.oninput = () => {
    state.sel.exq = exq.value; const pos = exq.selectionStart; render();
    const el = document.getElementById('exq'); el.focus(); el.setSelectionRange(pos, pos);
  };

  const pc = document.getElementById('posChips');
  if (pc) pc.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    state.sel.pos = b.dataset.pos === state.sel.pos ? '' : b.dataset.pos; render();
  });

  const chips = document.getElementById('raceChips');
  if (chips) chips.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const s = b.dataset.season;
    const cur = state.sel.race || [state.data.breakdown.seasons[1], state.data.breakdown.seasons[0]].filter(Boolean);
    state.sel.race = cur.includes(s) ? cur.filter(x => x !== s) : cur.concat([s]).slice(-6);
    render();
  });

  const drop = document.getElementById('drop'), pick = document.getElementById('pick');
  if (pick) pick.onchange = () => pick.files[0] && readFile(pick.files[0]);
  if (drop){
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.remove('over');
    }));
    drop.addEventListener('drop', e => {
      const f = e.dataTransfer.files[0]; if (f) readFile(f);
    });
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.player){ state.player = null; render(); }
});
window.addEventListener('resize', () => renderNav());
boot();
countVisit();
</script>
