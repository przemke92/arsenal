<style>
:root{
  --ink:#141010;
  --ink2:#1D1717;
  --ink3:#272020;
  --line:#3A2F2E;
  --parchment:#EDE6DA;
  --muted:#8F827A;
  --red:#DB0007;
  --red-dim:#7A1114;
  --win:#3FA34D;
  --draw:#E0B341;
  --loss:#C0342B;
  --brass:#C8A15A;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --logo:"Saira","Eurostile","Arial",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.005em;text-transform:uppercase;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:212px;flex:0 0 212px;border-right:1px solid var(--line);
  padding:22px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ink);
}
.brand{
  display:flex;flex-direction:column;align-items:flex-start;gap:11px;
  text-decoration:none;color:var(--parchment);
  padding:2px 18px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.brand .cannon{width:104px;height:auto;display:block;transition:opacity .15s}
.brand:hover .cannon{opacity:.82}
.lockup{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.lockup .l1{
  font-family:var(--logo);font-weight:700;font-size:19px;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;
}
.lockup .l2{
  font-family:var(--logo);font-weight:300;font-size:15px;color:var(--red);
  text-transform:uppercase;letter-spacing:.28em;white-space:nowrap;
}
.navgroup{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);padding:16px 18px 6px;text-transform:uppercase}
.navlink{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:7px 18px;text-decoration:none;color:var(--parchment);
  border-left:2px solid transparent;font-size:14px;
}
.navlink:hover{background:var(--ink2)}
.navlink.on{border-left-color:var(--red);background:var(--ink2)}
.navlink .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;padding:34px 40px 90px;max-width:1280px}

/* ---------- page furniture ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--brass);text-transform:uppercase}
.page-title{font-size:34px;line-height:1.02;margin:8px 0 10px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 26px}
.rule{height:1px;background:var(--line);margin:26px 0}
.section-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.section-h h2{font-size:17px}
.section-h .hint{font-family:var(--mono);font-size:11px;color:var(--muted)}

.matchbar{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:22px}
.mcard{background:var(--ink2);padding:14px 16px 13px;min-width:0}
.mlabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--brass);
  text-transform:uppercase;margin-bottom:10px}
.mtop{display:flex;align-items:center;gap:11px}
.mwho{flex:1;min-width:0}
.mclub{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvenue{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mscore{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--parchment)}
.mfoot{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--ink3);font-family:var(--mono);font-size:11px;color:var(--muted)}
.mcomp{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mwhen{color:var(--parchment);white-space:nowrap}
.badge{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:34px;height:34px;border-radius:3px}
.mfoot .badge{width:18px;height:18px}
.badge img{width:100%;height:100%;object-fit:contain}
.badge.mono{background:var(--ink3);color:var(--muted);font-family:var(--mono);font-size:12px}
.mfoot .badge.mono{font-size:9px}
@media (max-width:620px){
  .matchbar{grid-template-columns:1fr}
  /* card order flips on mobile: last game read first as recap, next game
     (with the kick-off strip right under it) leads into what's coming */
  .matchbar .mnext{order:2}
  .matchbar .mlast{order:1}
  .matchbar .kickoff{order:3}
}
/* On a desktop there is room to let the crests breathe: at 34px a raster logo
   is being squeezed into far fewer pixels than it ships with, which is what
   made them look coarse. */
@media (min-width:621px){
  .mtop{gap:15px}
  .badge{width:56px;height:56px;border-radius:4px}
  .badge.mono{font-size:18px}
  .mfoot{gap:10px}
  .mfoot .badge{width:26px;height:26px}
  .mfoot .badge.mono{font-size:11px}
  .mclub{font-size:19px}
  .mscore{font-size:26px}
}
a.mcardLink{display:block;color:inherit;text-decoration:none}
a.mcardLink:hover{background:var(--ink3)}
.mratingsHint{margin-left:auto;color:var(--brass);font-family:var(--mono);font-size:11px;white-space:nowrap}

.pitchCard{background:var(--ink2);padding:16px 14px 18px}
.pitchSvg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.pitchSvg .pmark{cursor:pointer}
.pitchSvg .prat{font-family:var(--mono);font-size:12px;font-weight:700}
.pitchSvg .pnamet{font-family:var(--mono);font-size:10px;fill:var(--parchment);letter-spacing:.01em}
.pitchSvg .subMark{font-size:13px;font-weight:700}
.pitchSvg .subMark.down{fill:var(--loss)}
.pitchSvg .gaIcon.ball{font-size:11px}
.pitchSvg .gaIcon.assist{font-size:10px;font-weight:700;fill:#1D1717}
.subsList{margin-top:16px;padding-top:14px;border-top:1px solid var(--ink3)}
.subsHead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--brass);
  text-transform:uppercase;margin-bottom:8px}
.subRow{display:flex;align-items:center;gap:9px;padding:7px 2px}
.subRow.clickable{cursor:pointer}
.subRow.clickable:hover{background:var(--ink3)}
.subMark.up{color:var(--win);font-weight:700;font-size:13px;width:14px;text-align:center}
.subName{font-family:var(--mono);font-size:12px;color:var(--parchment);flex:1}
.subRow .gaIcon{font-family:var(--mono);display:inline-flex;align-items:center;justify-content:center}
.subRow .gaIcon.ball{font-size:13px}
.subRow .gaIcon.assist{font-size:10px;font-weight:700;color:#1D1717;background:var(--brass);
  width:15px;height:15px;border-radius:50%}
.subRating{font-family:var(--mono);font-size:12px;font-weight:700;min-width:26px;text-align:right}

.kickoff{grid-column:1/-1;background:var(--ink2);padding:15px 16px 16px;text-align:center}
.klabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--brass);
  text-transform:uppercase;margin-bottom:10px}
.countdown{display:flex;gap:20px;justify-content:center}
.cseg{display:flex;flex-direction:column;align-items:center;min-width:36px}
.cval{font-family:var(--mono);font-size:23px;font-weight:600;color:var(--parchment);font-variant-numeric:tabular-nums;line-height:1}
.clab{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.12em;margin-top:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
/* an odd number of tiles under a 2-up mobile grid leaves one lonely tile with
   a blank cell beside it; this centres the orphan across the row instead */
.kpis > .kpi:last-child:nth-child(odd){grid-column:1/-1;max-width:260px;margin:0 auto;width:100%}

table.standings{width:100%;font-size:13px;border-collapse:collapse}
table.standings th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:right;padding:8px 7px;background:var(--ink2);
  border-bottom:1px solid var(--line)}
table.standings th.l,table.standings td.l{text-align:left}
table.standings td{padding:6px 7px;text-align:right;border-bottom:1px solid var(--ink3)}
table.standings .crest{width:22px}
table.standings .crest img{width:18px;height:18px;object-fit:contain;vertical-align:middle;display:block}
table.standings .team{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1px}
tr.arsRow{background:rgba(219,0,7,.16)}
tr.arsRow td{color:var(--parchment)}
tr.arsRow .team{color:var(--red);font-weight:700}
tr.arsRow td.num:first-child{color:var(--red);font-weight:700}
@media (max-width:620px){table.standings .hideS{display:none}}
.kpi{background:var(--ink2);padding:14px 16px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;margin-top:5px}
.kpi .s{font-size:13px;color:var(--parchment);margin-top:3px}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line)}
.fixed{table-layout:fixed;min-width:1090px;--w-no:42px;--w-pos:46px;--w-nat:44px}
.fixed col.c-no{width:var(--w-no)}
.fixed col.c-name{width:200px}
.fixed col.c-pos{width:var(--w-pos)}
.fixed col.c-nat{width:var(--w-nat)}
.fixed col.c-stat{width:46px}
.fixed col.c-tot{width:54px}
.fixed col.c-ratio{width:54px}
.narrow .fixed{min-width:420px;--w-no:36px}
.narrow .fixed col.c-no{width:var(--w-no)}
.narrow .fixed col.c-name{width:150px}
.narrow .fixed col.c-tot{width:58px}
.narrow .fixed col.c-ratio{width:52px}

/* the identity columns stay put while the stats scroll sideways */
.fixed th:nth-child(1),.fixed td:nth-child(1){position:sticky;left:0;z-index:2}
.fixed td:nth-child(1){background:var(--ink)}
.fixed th:nth-child(1){background:var(--ink2);z-index:3}
.fixed tbody tr:hover td:nth-child(1){background:var(--ink2)}

/* records: # then player */
.fixed.rec th:nth-child(2),.fixed.rec td:nth-child(2){position:sticky;left:var(--w-no);z-index:2;
  box-shadow:1px 0 0 var(--line)}
.fixed.rec td:nth-child(2){background:var(--ink)}
.fixed.rec th:nth-child(2){background:var(--ink2);z-index:3}
.fixed.rec tbody tr:hover td:nth-child(2){background:var(--ink2)}

/* squad: # then position, nationality and player */
.fixed.sq th:nth-child(2),.fixed.sq td:nth-child(2){position:sticky;left:var(--w-no);z-index:2}
.fixed.sq th:nth-child(3),.fixed.sq td:nth-child(3){position:sticky;left:calc(var(--w-no) + var(--w-pos));z-index:2}
.fixed.sq th:nth-child(4),.fixed.sq td:nth-child(4){position:sticky;
  left:calc(var(--w-no) + var(--w-pos) + var(--w-nat));z-index:2;box-shadow:1px 0 0 var(--line)}
.fixed.sq td:nth-child(2),.fixed.sq td:nth-child(3),.fixed.sq td:nth-child(4){background:var(--ink)}
.fixed.sq th:nth-child(2),.fixed.sq th:nth-child(3),.fixed.sq th:nth-child(4){background:var(--ink2);z-index:3}
.fixed.sq tbody tr:hover td:nth-child(2),.fixed.sq tbody tr:hover td:nth-child(3),
.fixed.sq tbody tr:hover td:nth-child(4){background:var(--ink2)}
.fixed td,.fixed th{overflow:hidden}
.fixed td.l,.fixed th.l{text-overflow:ellipsis;white-space:nowrap}
.fixed td.num{padding-left:4px;padding-right:7px}
.fixed thead th.grp{
  text-align:center;white-space:normal;line-height:1.12;padding:7px 4px;
  border-left:1px solid var(--ink3);
}
.fixed thead th.grp:first-of-type{border-left:none}
.fixed thead th.grp.tot{color:var(--brass);border-right:1px solid var(--line)}
.narrow .fixed{min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
thead th{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:right;padding:9px 10px;
  background:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap;
}
thead th.l,tbody td.l{text-align:left}
thead th.c{text-align:center}
tbody td.c{text-align:center}
td.pos{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.04em}
td.nat{line-height:1}
img.flag{width:20px;height:15px;object-fit:cover;border-radius:2px;vertical-align:middle;
  box-shadow:0 0 0 1px rgba(237,230,218,.14)}
.natcode{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:6px}
.loanTag{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--brass);
  border:1px solid var(--brass);border-radius:3px;padding:1px 5px;margin-left:7px;
  text-transform:uppercase;vertical-align:middle;white-space:nowrap}
tr.loanRow{opacity:.55}
tr.loanRow:hover{opacity:.9}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--parchment)}
thead th.sorted{color:var(--brass)}
tbody td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--ink3);white-space:nowrap}
tbody tr:hover td{background:var(--ink2)}
tbody tr.clickable{cursor:pointer}
td.name{font-weight:500}
td.name .sn{font-weight:600}
td.name .gn{color:var(--muted)}
.ledger td.pname .gn{color:var(--muted)}
td.zero{color:#4E4442}
.shirt{font-family:var(--mono);font-size:11px;color:var(--brass);width:34px}
.goal{color:var(--red);font-weight:600}
.assist{color:var(--brass);font-weight:600}

/* ---------- ledger grid ---------- */
.ledger{overflow:auto;border:1px solid var(--line);max-height:74vh;--w-pn:186px;--w-tt:48px}
@media (max-width:900px){.ledger{--w-pn:140px;--w-tt:42px}}
.ledger table{border-collapse:separate;border-spacing:0}
.ledger th.fix{
  padding:0;background:var(--ink2);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:2;
}
.ledger th.fix .box{width:30px;padding:8px 0 7px;text-align:center}
.ledger th.fix .opp{font-family:var(--mono);font-size:9px;letter-spacing:.02em;color:var(--parchment);
  writing-mode:vertical-rl;transform:rotate(180deg);height:76px;margin:0 auto;white-space:nowrap;overflow:hidden}
.ledger th.fix .st{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:5px}
.ledger th.corner{position:sticky;left:0;top:0;z-index:3;background:var(--ink2);text-align:left;
  border-bottom:1px solid var(--line);width:var(--w-pn);min-width:var(--w-pn);max-width:var(--w-pn)}
.ledger td.pname{position:sticky;left:0;background:var(--ink);
  text-align:left;font-size:13px;z-index:1;
  width:var(--w-pn);min-width:var(--w-pn);max-width:var(--w-pn);
  overflow:hidden;text-overflow:ellipsis}
.ledger tr:hover td.pname{background:var(--ink2)}
/* Apps and Gls are pinned beside the name, so the season total stays on screen
   however far right the fixture grid is scrolled. */
.ledger th.toth{position:sticky;top:0;z-index:3;background:var(--ink2);
  border-bottom:1px solid var(--line);text-align:right;padding-right:10px;
  width:var(--w-tt);min-width:var(--w-tt);max-width:var(--w-tt)}
.ledger th.toth.t1,.ledger td.tot.t1{left:var(--w-pn)}
.ledger th.toth.t2,.ledger td.tot.t2{left:calc(var(--w-pn) + var(--w-tt));
  border-right:1px solid var(--line)}
.ledger th.toth.t2{box-shadow:1px 0 0 var(--line)}
.ledger tr:hover td.tot{background:var(--ink2)}
.ledger td.cell{width:30px;height:26px;text-align:center;padding:0;border-bottom:1px solid var(--ink3)}
.pip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:18px;
  border-radius:2px;font-family:var(--mono);font-size:11px;font-weight:600}
.pip.app{background:var(--ink3);color:var(--muted)}
.pip.scored{background:var(--red);color:#fff}
.ledger td.tot{position:sticky;z-index:1;background:var(--ink);font-family:var(--mono);font-size:12px;
  text-align:right;padding-right:10px;border-bottom:1px solid var(--ink3);
  width:var(--w-tt);min-width:var(--w-tt);max-width:var(--w-tt)}

/* ---------- points matrix (hero) ---------- */
.matrix{overflow-x:auto;border:1px solid var(--line);background:var(--ink2);padding:14px 16px 16px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.mrow .lab{font-family:var(--mono);font-size:10px;color:var(--muted);width:56px;flex:0 0 56px;text-align:right}
.mrow.cur .lab{color:var(--brass)}
.mcells{display:flex;gap:2px}
.mc{width:9px;height:9px;border-radius:1px;background:#2A2222}
.matrix.anim .mc{
  animation-name:cellIn;animation-duration:.42s;animation-delay:var(--d,0ms);
  animation-timing-function:cubic-bezier(.18,.9,.28,1);animation-fill-mode:both;
}
@keyframes cellIn{
  0%{opacity:0;transform:scale(.15) translateY(6px)}
  55%{opacity:1;transform:scale(1.35) translateY(0)}
  100%{opacity:1;transform:scale(1)}
}
.matrix.anim .mrow .lab,.matrix.anim .mrow .pts{
  animation-name:labIn;animation-duration:.45s;animation-delay:var(--dl,0ms);
  animation-timing-function:ease;animation-fill-mode:both;
}
@keyframes labIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
.mc.w{background:var(--win)}
.mc.d{background:var(--draw)}
.mc.l{background:var(--loss)}
.mc.na{background:transparent}
.mrow .pts{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:8px;width:52px}
.mhead{display:flex;gap:8px;margin-bottom:6px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.mhead .lab{width:56px;flex:0 0 56px}
.legend{display:flex;gap:16px;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px;vertical-align:middle}

/* ---------- charts ---------- */
.chartbox{border:1px solid var(--line);background:var(--ink2);padding:16px}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis{stroke:var(--line);stroke-width:1}
.gridline{stroke:#241D1D;stroke-width:1}
.axistext{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{
  font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;border-radius:2px;
}
.chip:hover{color:var(--parchment)}
.chip.on{border-color:var(--red);color:var(--parchment);background:rgba(219,0,7,.13)}

/* ---------- controls ---------- */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=search]{
  background:var(--ink2);color:var(--parchment);border:1px solid var(--line);
  padding:7px 10px;font-family:var(--mono);font-size:12px;border-radius:2px;
}
input[type=search]{min-width:200px}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{
  font-family:var(--mono);font-size:12px;padding:8px 14px;border:1px solid var(--brass);
  background:transparent;color:var(--brass);cursor:pointer;border-radius:2px;
}
.btn:hover{background:var(--brass);color:var(--ink)}

/* ---------- player panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,5,5,.72);display:flex;justify-content:flex-end;z-index:50}
.panel{width:min(560px,100%);background:var(--ink);border-left:1px solid var(--line);
  height:100%;overflow-y:auto;padding:26px 28px 60px}
.phead{display:flex;gap:16px;align-items:flex-start;margin:22px 0 20px}
.pinfo{flex:1;min-width:0}
.pmeta{font-size:14px;margin:4px 0 8px}
.pstats{color:var(--muted);font-size:13px}
.mug{
  position:relative;flex:0 0 112px;width:112px;height:132px;
  display:flex;align-items:center;justify-content:center;
}
/* no frame, no plate: the cutout sits straight on the panel and the bottom edge
   is dissolved with a mask so the crop line never shows */
.mug img{
  width:100%;height:100%;object-fit:cover;object-position:50% 4%;
  position:relative;z-index:2;
  -webkit-mask-image:linear-gradient(to bottom,#000 62%,rgba(0,0,0,.35) 88%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 62%,rgba(0,0,0,.35) 88%,transparent 100%);
}
.mug.nophoto img{display:none}
.mug.withphoto .mono{display:none}
.mug.withphoto.nophoto .mono{display:block}
.mug .mono{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--display);font-size:34px;color:var(--ink3);z-index:1;user-select:none;
}
.mug .shirtno{
  position:absolute;right:2px;bottom:2px;z-index:3;
  font-family:var(--mono);font-size:11px;color:var(--brass);
}
.panel .close{position:absolute;top:10px;right:14px;background:none;border:none;
  color:var(--muted);font-size:24px;cursor:pointer;line-height:1;z-index:6}
.panel .close:hover{color:var(--parchment)}
.panel h2{font-size:23px;line-height:1.06;margin-bottom:6px}

/* ---------- status ---------- */
.status{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;
  color:var(--muted);padding:0 18px;margin-top:18px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:0 0 7px}
.dot.live{background:#3FA34D}
.dot.warn{background:var(--red)}
.drop{border:1px dashed var(--line);padding:26px;text-align:center;color:var(--muted);border-radius:3px}
.drop.over{border-color:var(--brass);color:var(--parchment)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media (max-width:900px){.cols2{grid-template-columns:1fr}}
.narrow table{font-size:13px}
.narrow td,.narrow th{padding:6px 8px}
.mono-list{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.9}
.note{border-left:2px solid var(--brass);padding:2px 0 2px 14px;color:var(--muted);margin:16px 0}

/* page entrance: opacity only on scroll containers, because a transform on an
   ancestor breaks position:sticky in the tables */
.main.enter > *{
  animation-name:riseIn;animation-duration:.42s;animation-fill-mode:both;
  animation-timing-function:cubic-bezier(.2,.85,.3,1);
}
.main.enter > *:nth-child(1){animation-delay:0ms}
.main.enter > *:nth-child(2){animation-delay:60ms}
.main.enter > *:nth-child(3){animation-delay:110ms}
.main.enter > *:nth-child(4){animation-delay:155ms}
.main.enter > *:nth-child(5){animation-delay:195ms}
.main.enter > *:nth-child(n+6){animation-delay:230ms}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.main.enter .tablewrap,.main.enter .ledger{animation-name:fadeIn}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.main.enter .kpi{animation-name:fadeIn;animation-duration:.5s;animation-fill-mode:both}
.main.enter .kpi:nth-child(1){animation-delay:120ms}
.main.enter .kpi:nth-child(2){animation-delay:180ms}
.main.enter .kpi:nth-child(3){animation-delay:240ms}
.main.enter .kpi:nth-child(4){animation-delay:300ms}
.main.enter .kpi:nth-child(n+5){animation-delay:340ms}
.main.enter tbody tr:nth-child(-n+18){
  animation-name:fadeIn;animation-duration:.38s;animation-fill-mode:both;
}
.main.enter tbody tr:nth-child(1){animation-delay:200ms}
.main.enter tbody tr:nth-child(2){animation-delay:225ms}
.main.enter tbody tr:nth-child(3){animation-delay:250ms}
.main.enter tbody tr:nth-child(4){animation-delay:275ms}
.main.enter tbody tr:nth-child(5){animation-delay:300ms}
.main.enter tbody tr:nth-child(6){animation-delay:325ms}
.main.enter tbody tr:nth-child(7){animation-delay:350ms}
.main.enter tbody tr:nth-child(8){animation-delay:375ms}
.main.enter tbody tr:nth-child(9){animation-delay:400ms}
.main.enter tbody tr:nth-child(n+10){animation-delay:420ms}

/* charts draw themselves in */
.draw{
  stroke-dasharray:1;stroke-dashoffset:1;
  animation-name:drawIn;animation-duration:1.05s;animation-delay:var(--dd,120ms);
  animation-timing-function:cubic-bezier(.25,.8,.35,1);animation-fill-mode:forwards;
}
@keyframes drawIn{to{stroke-dashoffset:0}}
.popIn{
  animation-name:fadeIn;animation-duration:.45s;animation-delay:var(--dd,900ms);
  animation-fill-mode:both;
}

.loading{padding:70px 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.topbar{display:none}

@media (max-width:620px){
  /* Never display:none a table cell here. It removes the cell from the row and
     shifts every later cell into the wrong column. Narrow the columns instead. */
  .fixed{min-width:812px;--w-no:26px;--w-pos:32px;--w-nat:30px}
  .fixed col.c-name{width:104px}
  .fixed col.c-tot{width:48px}
  .fixed col.c-ratio{width:48px}
  .narrow .fixed{min-width:340px;--w-no:30px}
  .narrow .fixed col.c-name{width:120px}
  .fixed td.pos{font-size:10px;padding-left:2px;padding-right:2px}
  .fixed td.nat{padding-left:2px;padding-right:2px}
  .fixed td.shirt{padding-left:4px;padding-right:4px}
  img.flag{width:18px;height:13px}
  .fixed td.l,.fixed th.l{font-size:12px}
  .fixed td.name{white-space:normal;text-overflow:clip;line-height:1.15;padding-top:5px;padding-bottom:5px}
  .fixed td.name .gn{display:block;font-size:11px}

  table.exlist{table-layout:auto;min-width:0;width:100%}
  table.exlist col{width:auto}
  table.exlist th:nth-child(2),table.exlist td:nth-child(2),
  table.exlist th:nth-child(3),table.exlist td:nth-child(3),
  table.exlist th:nth-child(4),table.exlist td:nth-child(4){position:static;left:auto}
  table.exlist th,table.exlist td{padding:8px 5px}
  table.exlist th:first-child,table.exlist td:first-child{padding-left:8px}
  table.exlist td.name{width:auto;min-width:0}
  table.exlist td.num,table.exlist th:not(.l){white-space:nowrap}
  table.exlist thead tr:first-child th{position:sticky;top:0;z-index:2;background:var(--ink2)}
}
@media (max-width:900px){
  .shell{display:block}
  .rail{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:16px 0 0}
  .brand{flex-direction:row;align-items:center;gap:12px;padding:2px 16px 12px}
  .brand .cannon{width:58px}
  .lockup{
    flex-direction:row;align-items:baseline;gap:8px;
    border-left:1px solid var(--line);padding-left:12px;
  }
  .lockup .l1{font-size:17px}
  .lockup .l2{font-size:15px;letter-spacing:.2em}
  .navgroup{display:none}
  .railnav{display:flex;overflow-x:auto;gap:0;padding:0 8px 2px}
  .navlink{border-left:none;border-bottom:2px solid transparent;white-space:nowrap;padding:9px 12px}
  .navlink.on{border-bottom-color:var(--red)}
  .navlink .n{display:none}
  .main{padding:22px 16px 70px}
  .page-title{font-size:26px}
  .mrow .lab{width:44px;flex:0 0 44px}
}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .28s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>

<script>
/* ============================================================
   1. PARSER  —  reads arsenal_stats.xlsx by structure, not by
   fixed cell addresses, so adding a player or a cup round is safe.
   ============================================================ */
const T = v => v === null || v === undefined ? '' : (typeof v === 'string' ? v.trim() : String(v));
const N = v => {
  if (v === null || v === undefined || v === '' || v === ' ') return 0;
  const n = typeof v === 'number' ? v : parseFloat(v);
  return isNaN(n) ? 0 : n;
};
const at = (aoa, r, c) => (aoa[r] && aoa[r][c] !== undefined) ? aoa[r][c] : null;

/* Finds the header row and the identity columns wherever they sit, so inserting
   a Position or Nationality column into the sheet never breaks the parse. */
const HDR = {
  name: ['name', 'player'],
  pos:  ['pos', 'position', 'poz', 'pozycja', 'role'],
  nat:  ['nat', 'nationality', 'country', 'nationalities', 'nar', 'nation', 'kraj', 'narodowosc'],
  loan: ['loan', 'on loan', 'wypozyczenie', 'wypożyczenie', 'wypozyczony', 'wypożyczony']
};
const APPS_H = ['app', 'apps', 'a'];
const GLS_H  = ['gls', 'goals', 'g'];
const AST_H  = ['ast', 'assists', 'as'];
const isH = (v, list) => list.indexOf(T(v).toLowerCase()) > -1;
function findHeader(aoa){
  for (let r = 0; r < 8; r++){
    for (let c = 0; c < 8; c++){
      if (HDR.name.indexOf(T(at(aoa, r, c)).toLowerCase()) > -1){
        const cols = {no: 0, name: c};
        for (let cc = 0; cc < 40; cc++){
          const lab = T(at(aoa, r, cc)).toLowerCase();
          if (HDR.pos.indexOf(lab) > -1) cols.pos = cc;
          if (HDR.nat.indexOf(lab) > -1) cols.nat = cc;
          if (HDR.loan.indexOf(lab) > -1) cols.loan = cc;
        }
        return {row: r, cols};
      }
    }
  }
  return null;
}
function headerRow(aoa){ const h = findHeader(aoa); return h ? h.row : -1; }

/* If the header text is not one we recognise, work out which column holds the
   position and which the nationality by looking at what is actually in them. */
function sniffIdentity(aoa, h, id){
  const rows = [];
  for (let r = h + 1; r < Math.min(aoa.length, h + 60); r++) rows.push(r);
  const limit = Math.min(id.name + 5, 10);
  for (let c = 0; c <= limit; c++){
    if (c === id.name || c === id.pos || c === id.nat) continue;
    const vals = rows.map(r => T(at(aoa, r, c))).filter(Boolean);
    if (vals.length < 3) continue;
    const natHits = vals.filter(v => natEntry(v)).length;
    const posHits = vals.filter(v => posGroup(v)).length;
    if (id.nat === undefined && natHits / vals.length >= 0.6 && natHits >= posHits){ id.nat = c; continue; }
    if (id.pos === undefined && posHits / vals.length >= 0.6){ id.pos = c; }
  }
  return id;
}

function parseSquadSheet(aoa){
  const hd = findHeader(aoa); if (!hd) return null;
  const h = hd.row, id = sniffIdentity(aoa, hd.row, hd.cols);
  const above = h - 1, comps = [];
  const width = Math.max(...aoa.slice(0, h + 1).map(r => (r || []).length));
  let c = Math.max(id.name, id.pos === undefined ? 0 : id.pos, id.nat === undefined ? 0 : id.nat) + 1;
  let hasAst = false;
  while (c < width){
    if (isH(at(aoa, h, c), APPS_H)){
      let name = T(at(aoa, above, c)), cc = c;
      while (!name && cc > 0){ cc--; name = T(at(aoa, above, cc)); }
      const g = isH(at(aoa, h, c + 1), GLS_H) ? c + 1 : null;
      let sCol = null;
      if (g !== null && isH(at(aoa, h, g + 1), AST_H)){ sCol = g + 1; hasAst = true; }
      comps.push({name: name || 'Comp', a: c, g, s: sCol});
      c = (sCol !== null ? sCol : (g !== null ? g : c)) + 1;
    } else c++;
  }
  const players = [];
  for (let r = h + 1; r < aoa.length; r++){
    const name = T(at(aoa, r, id.name)); if (!name) continue;
    const p = {no: T(at(aoa, r, id.no)), name, comps: {}};
    if (id.pos !== undefined) p.pos = T(at(aoa, r, id.pos));
    if (id.nat !== undefined) p.nat = T(at(aoa, r, id.nat));
    if (id.loan !== undefined) p.loan = T(at(aoa, r, id.loan));
    comps.forEach(k => p.comps[k.name] = {
      a: N(at(aoa, r, k.a)),
      g: k.g === null ? 0 : N(at(aoa, r, k.g)),
      s: k.s === null ? 0 : N(at(aoa, r, k.s))
    });
    p.total = p.comps['Total'] || null;
    delete p.comps['Total'];
    if (!p.total){
      p.total = {a: 0, g: 0, s: 0};
      Object.values(p.comps).forEach(v => {p.total.a += v.a; p.total.g += v.g; p.total.s += v.s;});
    }
    players.push(p);
  }
  return {comps: comps.map(k => k.name).filter(n => n.toLowerCase() !== 'total'), players, hasAst};
}

function parseMatchSheet(aoa, key, label){
  const hd = findHeader(aoa); if (!hd) return null;
  const h = hd.row, nameCol = hd.cols.name, noCol = hd.cols.no;
  const oppRow = h - 1, stageRow = h - 2;
  const width = Math.max(...aoa.slice(0, h + 1).map(r => (r || []).length));
  const fixtures = [], cols = [];
  let stage = '';
  for (let c = nameCol + 1; c < width; c++){
    if (isH(at(aoa, h, c), APPS_H)){
      const opp = T(at(aoa, oppRow, c));
      if (opp.charAt(0) === 'Σ') continue;          // running totals, not a fixture
      if (stageRow >= 0){ const st = T(at(aoa, stageRow, c)); if (st) stage = st; }
      fixtures.push({opponent: opp, stage});
      cols.push(c); c += 2;
    }
  }
  const players = [];
  for (let r = h + 1; r < aoa.length; r++){
    const name = T(at(aoa, r, nameCol)); if (!name) continue;
    const cells = cols.map(c => ({a: N(at(aoa, r, c)), g: N(at(aoa, r, c + 1)), s: N(at(aoa, r, c + 2))}));
    players.push({
      no: T(at(aoa, r, noCol)), name, cells,
      a: cells.reduce((t, x) => t + x.a, 0),
      g: cells.reduce((t, x) => t + x.g, 0),
      s: cells.reduce((t, x) => t + x.s, 0)
    });
  }
  return {key, label, fixtures, players};
}

function parseSingleMatchSheet(aoa, key, label){
  const hd = findHeader(aoa); if (!hd) return null;
  const h = hd.row, nc = hd.cols.name;
  const players = [];
  for (let r = h + 1; r < aoa.length; r++){
    const name = T(at(aoa, r, nc)); if (!name) continue;
    const a = N(at(aoa, r, nc + 1)), g = N(at(aoa, r, nc + 2)), sv = N(at(aoa, r, nc + 3));
    players.push({no: T(at(aoa, r, hd.cols.no)), name, a, g, s: sv, cells: [{a, g, s: sv}]});
  }
  return {key, label, fixtures: [{opponent: '', stage: label}], players};
}

function parseMatchInfo(a){
  if (!a) return null;
  let labRow = -1;
  for (let r = 0; r < Math.min(6, a.length); r++)
    if ((a[r] || []).some(v => T(v).toUpperCase().indexOf('NEXT') > -1)){ labRow = r; break; }
  if (labRow < 0) return null;
  const blocks = [];
  (a[labRow] || []).forEach((v, c) => { if (T(v)) blocks.push({label: T(v), start: c}); });
  let hdr = -1;
  for (let r = labRow; r < Math.min(labRow + 5, a.length); r++)
    if ((a[r] || []).some(v => T(v).toLowerCase() === 'date')){ hdr = r; break; }
  if (hdr < 0) return null;
  const out = {};
  blocks.forEach((b, i) => {
    const end = i + 1 < blocks.length ? blocks[i + 1].start : (a[hdr] || []).length;
    const rec = {};
    for (let c = b.start; c < end; c++){
      const k = T(at(a, hdr, c));
      if (k) rec[k.toLowerCase()] = fmtCell(at(a, hdr + 1, c));
    }
    out[b.label.toUpperCase().indexOf('NEXT') > -1 ? 'next' : 'last'] = rec;
  });
  return out;
}

/* Post-match ratings sheet: Pos / Name / Rating / Status, in any column
   order. Name here is just whatever short form the person typed (matched
   against the roster by surname when the pitch graphic is built), so this
   parser stays deliberately loose about column order and doesn't try to
   resolve identity itself. */
function parseRatings(aoa){
  if (!aoa) return null;
  let hRow = -1, cols = {};
  for (let r = 0; r < 5; r++){
    const rowVals = (aoa[r] || []).map(v => T(v).toLowerCase());
    const find = labels => rowVals.findIndex(v => labels.indexOf(v) > -1);
    const cName = find(HDR.name), cRating = find(['rating', 'ocena']);
    if (cName > -1 && cRating > -1){
      hRow = r;
      cols = {name: cName, rating: cRating, pos: find(HDR.pos), status: find(['status', 'stat']),
        ga: find(['goal/assist', 'goals/assists', 'g/a', 'ga'])};
      break;
    }
  }
  if (hRow < 0) return null;
  const rows = [];
  for (let r = hRow + 1; r < aoa.length; r++){
    const name = T(at(aoa, r, cols.name)); if (!name) continue;
    rows.push({
      name, pos: cols.pos > -1 ? T(at(aoa, r, cols.pos)) : '',
      rating: N(at(aoa, r, cols.rating)),
      status: cols.status > -1 ? T(at(aoa, r, cols.status)) : '',
      ga: cols.ga > -1 ? T(at(aoa, r, cols.ga)) : ''
    });
  }
  return rows.length ? rows : null;
}

function fmtCell(v){
  if (v instanceof Date && !isNaN(v)){
    const hh = v.getHours(), mm = v.getMinutes();
    if (v.getFullYear() < 1901 || (hh || mm))
      return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  }
  return T(v);
}

function parseRecords(aoa){
  const apps = [], goals = [];
  for (let r = 2; r < aoa.length; r++){
    if (T(at(aoa, r, 1))) apps.push({rank: N(at(aoa, r, 0)), name: T(at(aoa, r, 1)),
      apps: N(at(aoa, r, 2)), goals: N(at(aoa, r, 3))});
    if (T(at(aoa, r, 8))) goals.push({rank: N(at(aoa, r, 7)), name: T(at(aoa, r, 8)),
      goals: N(at(aoa, r, 9)), apps: N(at(aoa, r, 10))});
  }
  return {apps, goals};
}

function parseBreakdown(aoa){
  const width = Math.max(...aoa.map(r => (r || []).length));
  const seasons = [], eras = {};
  for (let c = 2; c < width; c++){
    const s = T(at(aoa, 1, c)); if (s) seasons.push({label: s, col: c});
    const e = T(at(aoa, 0, c)); if (e) eras[c] = e;
  }
  const eraFor = {}; let cur = '';
  seasons.forEach(s => { if (eras[s.col]) cur = eras[s.col]; eraFor[s.label] = cur; });

  const mwRows = [];
  for (let r = 2; r < 60; r++){
    const v = at(aoa, r, 1);
    if (typeof v === 'number') mwRows.push({mw: v, row: r});
    else if (T(v).toUpperCase() === 'SUM') break;
  }
  const grid = {}, avg = [];
  seasons.forEach(s => grid[s.label] = mwRows.map(m => {
    const v = at(aoa, m.row, s.col);
    return (v === null || T(v) === '') ? null : N(v);
  }));
  mwRows.forEach(m => { const v = at(aoa, m.row, 0); avg.push(v === null ? null : N(v)); });

  const sums = {}, positions = {};
  for (let r = 2; r < 60; r++){
    const lab = T(at(aoa, r, 1)).toUpperCase();
    if (lab === 'SUM') seasons.forEach(s => sums[s.label] = N(at(aoa, r, s.col)));
    if (lab === 'POS') seasons.forEach(s => positions[s.label] = N(at(aoa, r, s.col)));
  }

  let h = -1;
  for (let r = 0; r < aoa.length; r++) if (T(at(aoa, r, 0)).toLowerCase() === 'season'){ h = r; break; }
  const table = [], managers = [];
  if (h >= 0){
    let era = '';
    for (let r = h + 1; r < aoa.length; r++){
      const s = T(at(aoa, r, 0)); if (!s) continue;
      era = T(at(aoa, r, 10)) || era;
      table.push({season: s, pos: N(at(aoa, r, 1)), pts: N(at(aoa, r, 3)),
        w: N(at(aoa, r, 4)), d: N(at(aoa, r, 5)), l: N(at(aoa, r, 6)),
        gf: N(at(aoa, r, 7)), ga: N(at(aoa, r, 8)), gd: N(at(aoa, r, 9)), era});
    }
    for (let r = h; r < aoa.length; r++){
      const nm = T(at(aoa, r, 22));
      if (nm && /[A-Za-z]/.test(nm)){
        const w = N(at(aoa, r, 24)), d = N(at(aoa, r, 25)), l = N(at(aoa, r, 26));
        if (w || d || l) managers.push({name: nm, w, d, l});
      }
    }
  }
  return {seasons: seasons.map(s => s.label), eras: eraFor,
    matchweeks: mwRows.map(m => m.mw), grid, avg, sums, positions, table, managers};
}

function parseWorkbook(wb){
  const aoa = name => wb.Sheets[name]
    ? XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: null, blankrows: true})
    : null;
  const data = {};
  data.career = parseSquadSheet(aoa('Apps & Goals'));
  const agHd = findHeader(aoa('Apps & Goals'));
  data.idCols = agHd ? sniffIdentity(aoa('Apps & Goals'), agHd.row, agHd.cols) : {};

  const seasons = {};
  wb.SheetNames.filter(n => n.indexOf('Apps & Goals ') === 0).forEach(n => {
    seasons[n.replace('Apps & Goals ', '').trim()] = parseSquadSheet(aoa(n));
  });
  data.seasons = seasons;
  data.seasonKeys = Object.keys(seasons).sort((a, b) => parseInt(b) - parseInt(a));
  data.currentSeason = data.seasonKeys[0];

  data.competitions = [
    parseMatchSheet(aoa('Premier League'), 'premier-league', 'Premier League'),
    parseMatchSheet(aoa('Europe'), 'europe', 'Europe'),
    parseMatchSheet(aoa('FA Cup'), 'fa-cup', 'FA Cup'),
    parseMatchSheet(aoa('League Cup'), 'league-cup', 'League Cup'),
    parseSingleMatchSheet(aoa('Other (CS)'), 'community-shield', 'Community Shield')
  ].filter(Boolean);

  data.exPlayers = parseSquadSheet(aoa('Ex-Players'));
  data.match = parseMatchInfo(aoa('Match') || aoa('Matches'));
  data.ratings = parseRatings(aoa('Ratings'));
  /* Profiles come from the squad sheet first, then Ex-Players fills in everyone
     who has since left, so season pages know them too. Names are also indexed in
     a normalised form to survive punctuation and spacing differences. */
  data.profiles = {};
  data.profilesNorm = {};
  const addProfile = p => {
    if (!p.pos && !p.nat && !p.loan) return;
    const rec = {pos: p.pos || '', nat: p.nat || '', loan: p.loan || ''};
    if (!data.profiles[p.name]) data.profiles[p.name] = rec;
    const key = normName(p.name);
    if (key && !data.profilesNorm[key]) data.profilesNorm[key] = rec;
  };
  data.career.players.forEach(addProfile);
  if (data.exPlayers) data.exPlayers.players.forEach(addProfile);
  data.records = parseRecords(aoa('All-time records'));
  data.breakdown = parseBreakdown(aoa('Season Breakdown'));

  /* Read the date off the local clock, not toISOString(): the workbook stores a
     naive date, and converting it to UTC shifts it a day back east of Greenwich. */
  let asOf = null;
  const ag = aoa('Apps & Goals');
  for (let r = 0; r < 4 && !asOf; r++){
    for (let c = 0; c < 40; c++){
      const v = at(ag, r, c);
      if (v instanceof Date && !isNaN(v)){
        asOf = v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0')
          + '-' + String(v.getDate()).padStart(2, '0');
        break;
      }
    }
  }
  data.meta = {asOf, source: 'arsenal_stats.xlsx'};
  return data;
}

    const entries = (j.children && j.children[0] && j.children[0].standings && j.children[0].standings.entries) || [];
    const statNum = (e, type) => {
      const s = (e.stats || []).find(x => x.type === type);
      return s ? Math.round(s.value) : 0;
    };
    const rows = entries.map(e => ({
      team: e.team.displayName,
      logo: (e.team.logos && e.team.logos[0]) ? e.team.logos[0].href : '',
      rank: statNum(e, 'rank'), gp: statNum(e, 'gamesplayed'),
      w: statNum(e, 'wins'), d: statNum(e, 'ties'), l: statNum(e, 'losses'),
      gd: statNum(e, 'pointdifferential'), pts: statNum(e, 'points')
    })).filter(r => r.team).sort((a, b) => a.rank - b.rank);
    if (rows.length) state.standings = {rows};
  }catch(e){ /* an unofficial feed: if it's blocked or reshaped, the table quietly stays off */ }
}

async function loadBadges(){
  try{
    const r = await fetch('data/badges.json?v=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const j = await r.json();
    const norm = o => { const m = {}; Object.keys(o || {}).forEach(k => { if (o[k]) m[normName(k)] = o[k]; }); return m; };
    state.badges = {clubs: norm(j.clubs), competitions: norm(j.competitions)};
  }catch(e){ /* initials stand in for missing crests */ }
}

async function loadPhotos(){
  try{
    const r = await fetch('data/players.json?v=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const j = await r.json();
    const map = {};
    Object.keys(j).forEach(k => { map[normName(k)] = j[k]; });
    state.photos = map;
  }catch(e){ /* no photo map yet: monograms carry the panel */ }
}

async function boot(){
  const preview = readPreview();
  if (preview){ state.data = preview; state.source = 'local'; render(); return; }
  try{
    const res = await fetch(XLSX_PATH + '?v=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    state.data = parseWorkbook(XLSX.read(buf, {type: 'array', cellDates: true}));
    state.source = 'repo';
  }catch(e){
    state.err = e.message;
    if (SNAPSHOT){ state.data = SNAPSHOT; state.source = 'snapshot'; }
  }
  render();
  await Promise.all([loadPhotos(), loadBadges(), loadStandings()]);
  render();
}

function readFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      state.data = parseWorkbook(XLSX.read(new Uint8Array(fr.result), {type: 'array', cellDates: true}));
      state.source = 'local'; state.err = null;
    }catch(e){ state.err = 'Could not read that file: ' + e.message; }
    render();
  };
  fr.readAsArrayBuffer(file);
}

const POS_WORD = {goalkeeper:'GK', keeper:'GK', defender:'DF', defence:'DF', midfielder:'MF',
  midfield:'MF', forward:'FW', attacker:'FW', striker:'ST', winger:'W', back:'B', centre:'C', center:'C'};
const posShort = p => {
  const v = T(p); if (!v) return '';
  if (v.length <= 3) return v.toUpperCase();
  const words = v.split(/[\s\-\/]+/).filter(Boolean);
  if (words.length === 1) return POS_WORD[words[0].toLowerCase()] || v.slice(0, 3).toUpperCase();
  return words.map(w => POS_WORD[w.toLowerCase()] || w[0]).join('').slice(0, 3).toUpperCase();
};
const posGroup = p => {
  const v = T(p).toLowerCase(); if (!v) return '';
  if (/goal|keeper|^gk/.test(v)) return 'GK';
  if (/def|back|^cb|^rb|^lb|^df/.test(v)) return 'DF';
  if (/mid|^cm|^dm|^am|^mf/.test(v)) return 'MF';
  if (/for|attack|strik|wing|^st|^fw|^rw|^lw|^cf/.test(v)) return 'FW';
  return '';
};

const NAT = {};
const ISO_EXTRA = 'GB:United Kingdom|IE:Ireland|CN:China|HK:Hong Kong|TW:Taiwan|SG:Singapore|'
  + 'AE:United Arab Emirates|IN:India|ID:Indonesia|MY:Malaysia|PK:Pakistan|BD:Bangladesh|'

ISO_EXTRA.split('|').forEach(row => {
  const [iso, name] = row.split(':');
  if (!NAT[iso]) NAT[iso] = {iso, name};
});
NAT_RAW.split('|').forEach(row => {
  const [code, iso, name] = row.split(':');
  NAT[code] = {iso, name};

  if (iso.length === 2 && !NAT[up]) NAT[up] = {iso, name, code};   // so 'PL' works too
});
const natEntry = nat => {
  const v = T(nat); if (!v) return null;
  return NAT[v.toUpperCase()] || NAT[v.toLowerCase()] || null;
};
const flagOf = nat => {
  const e = natEntry(nat);
  const iso = e ? e.iso : (T(nat).length === 2 ? T(nat).toUpperCase() : '');
  if (!iso || iso.length !== 2) return '';
  return String.fromCodePoint(...iso.split('').map(ch => 127397 + ch.charCodeAt(0)));
};
const natName = nat => { const e = natEntry(nat); return e ? e.name : T(nat); };
const flagImg = nat => {
  const e = natEntry(nat);
  const code = (e ? e.iso : (T(nat).length === 2 ? T(nat) : '')).toLowerCase();
  const label = natName(nat), fb = (e && e.code ? e.code : T(nat)).toUpperCase();

  return `<img class="flag" src="https://flagcdn.com/w40/${code}.png" width="20" height="15"

    onerror="this.replaceWith(document.createTextNode(this.dataset.code))">`;
};
const natShort = nat => {
  const v = T(nat); if (!v) return '';
  return flagOf(v) || (e => e && e.code ? e.code : v.slice(0, 3).toUpperCase())(natEntry(v));
};

const nameHTML = n => {
  const parts = String(n).split(' ');
  let i = 0;
  while (i < parts.length && parts[i] === parts[i].toUpperCase() && /[A-ZÀ-Ý]/.test(parts[i])) i++;
  if (i === 0 || i === parts.length) return `<span class="sn">${esc(n)}</span>`;
  return `<span class="sn">${esc(parts.slice(0, i).join(' '))}</span> <span class="gn">${esc(parts.slice(i).join(' '))}</span>`;
};
const normName = n => String(n).toUpperCase().normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = n => { const p = String(n).split(' '); return p.length > 1 ? p[0] : n; };

function sortTable(rows, key, dir, getters){
  const g = getters[key]; if (!g) return rows;
  return rows.slice().sort((a, b) => {
    const x = g(a), y = g(b);
    if (typeof x === 'string') return dir * x.localeCompare(y);
    return dir * (x - y);
  });
}

function breakdownKey(k){
  const m = String(k).match(/^(\d{2})\s*[-\/]\s*(\d{2})$/);
  return m ? '20' + m[1] + '/' + m[2] : String(k);

  const key = d.currentSeason;

  const appsLeader = topOf(cur.players, p => p.total.a);

function matrixBlock(d){
  const b = d.breakdown;
  const maxMw = Math.max(...b.matchweeks);
  /* The wave only plays the first time the page is opened, so re-rendering
     after a click does not replay the whole thing. */
  const anim = !state.matrixSeen;
  const rows = b.seasons.map((s, row) => {
    const vals = b.grid[s] || [];
    const cells = b.matchweeks.map((mw, i) => {
      const v = vals[i];
      const cls = v === null ? 'na' : v === 3 ? 'w' : v === 1 ? 'd' : 'l';
      const delay = anim ? ` style="--d:${(i * 9 + row * 5)}ms"` : '';
      return `<div class="mc ${cls}"${delay} title="${esc(s)} · MW${mw}${v === null ? '' : ' · ' + v + ' pts'}"></div>`;
    }).join('');
    const pts = b.sums[s], pos = b.positions[s];
    const rowDelay = anim ? ` style="--dl:${row * 5}ms"` : '';
    return `<div class="mrow ${s === b.seasons[0] ? 'cur' : ''}">
      <div class="lab"${rowDelay}>${esc(s)}</div>
      <div class="mcells">${cells}</div>
      <div class="pts"${rowDelay}>${pts ? pts + ' · ' + (pos === 1 ? '🏆' : pos) : ''}</div>
    </div>`;
  }).join('');
  return `<div class="matrix" data-anim="${anim ? '1' : '0'}">
      <div class="mhead"><div class="lab"></div><div>MW 1 → ${maxMw}</div></div>
      ${rows}
      <div class="legend">
        <span><i class="mc w" style="background:var(--win)"></i>Win</span>
        <span><i class="mc d" style="background:var(--draw)"></i>Draw</span>

        <span>🏆 League title</span>
      </div>
    </div>`;
}

function squadTable(d, set, key, dflt){
  const comps = set.comps;
  const ast = !!set.hasAst;                     // older season sheets have no assists
  const s = state.sort[key] || DEFAULT_SORT[key] || {col: 'no', dir: 1};
  const getters = {
    no: p => (p.no === '' || isNaN(parseInt(p.no))) ? 9999 : parseInt(p.no), name: p => p.name,
    pos: p => (['GK', 'DF', 'MF', 'FW'].indexOf(posGroup(prof(d, p).pos)) + 1) || 9,
    nat: p => prof(d, p).nat || 'zzz',
    apps: p => p.total.a, goals: p => p.total.g, assists: p => p.total.s || 0
  };
  comps.forEach(c => {
    getters['a_' + c] = p => p.comps[c].a;
    getters['g_' + c] = p => p.comps[c].g;
    getters['s_' + c] = p => p.comps[c].s || 0;
  });
  const rows = sortTable(set.players, s.col, s.dir, getters);
  rows.sort((a, b) => (prof(d, a).loan ? 1 : 0) - (prof(d, b).loan ? 1 : 0));
  const th = (col, label, cls) =>
    `<th class="${cls || ''} sortable ${s.col === col ? 'sorted' : ''}" data-sort="${col}" data-key="${key}">${label}${s.col === col ? (s.dir < 0 ? ' ↓' : ' ↑') : ''}</th>`;

  /* Total sits first, right beside the name, so the headline number is the one
     you see without scrolling; the per-competition split follows to its right. */

      <th class="grp tot" colspan="${span}">Total</th>
      ${comps.map(c => `<th class="grp" colspan="${span}">${esc(c)}</th>`).join('')}</tr>
      <tr><th></th><th></th><th></th><th class="l"></th>
      ${th('apps', 'App')}${th('goals', 'Gls')}${ast ? th('assists', 'Ast') : ''}
      ${comps.map(c => th('a_' + c, 'App', 'c') + th('g_' + c, 'Gls', 'c') + (ast ? th('s_' + c, 'Ast', 'c') : '')).join('')}</tr>
    </thead>
    <tbody>${rows.map(p => {
      const pr = prof(d, p);
      return `<tr class="clickable ${pr.loan ? 'loanRow' : ''}" data-player="${esc(p.name)}">
      <td class="num shirt">${esc(p.no)}</td>
      <td class="c pos" title="${esc(pr.pos)}">${esc(posShort(pr.pos)) || '·'}</td>
      <td class="c nat">${pr.nat ? flagImg(pr.nat) : '·'}</td>
      <td class="l name">${nameHTML(p.name)}${pr.loan ? '<span class="loanTag">Loan</span>' : ''}</td>
      <td class="num"><b>${p.total.a}</b></td>
      <td class="num goal"><b>${p.total.g || '·'}</b></td>
      ${ast ? `<td class="num assist"><b>${p.total.s || '·'}</b></td>` : ''}
      ${comps.map((c, i) => {
        const edge = i === 0 ? ' style="border-left:1px solid var(--line)"' : '';
        return `<td class="num ${p.comps[c].a ? '' : 'zero'}"${edge}>${p.comps[c].a || '·'}</td>`
          + cellNum(p.comps[c].g, 'goal') + (ast ? cellNum(p.comps[c].s, 'assist') : '');
      }).join('')}
    </tr>`;}).join('')}</tbody></table></div>`;
}

function badgeFor(name, kind){
  const map = (state.badges && state.badges[kind]) || {};
  const url = map[normName(name)];
